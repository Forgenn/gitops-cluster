# Renders and schema-validates every kustomization in infra/.
#
# This is the check that Renovate and the homelab-ops update-review job gate
# on. Before it existed this repo had no workflows at all, so Renovate's
# automergeType 'branch' waited forever for a status that never appeared and
# no dependency commit ever landed -- while ArgoCD auto-synced main to prod.
# Design: docs/plans/2026-09-20-fleet-update-automation.md
name: validate

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Into ~/.local/bin, not /usr/local/bin: ubuntu-24.04 runners already ship
      # kustomize and helm, and install_kustomize.sh refuses to overwrite
      # ("/usr/local/bin/kustomize exists. Remove it first."). Pinning our own
      # copies also keeps the check reproducible when the runner image moves.
      - name: Install kustomize, helm and kubeconform
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh \
            | bash -s -- 5.7.1 "$HOME/.local/bin"
          curl -sSfL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz \
            | tar xz -C /tmp linux-amd64/helm
          mv /tmp/linux-amd64/helm "$HOME/.local/bin/helm"
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /tmp kubeconform
          mv /tmp/kubeconform "$HOME/.local/bin/kubeconform"
          # GITHUB_PATH applies to later steps, so this step cannot use it yet.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: kustomize version && helm version --short && kubeconform -v

      - name: Build and validate manifests
        run: ./scripts/validate-manifests.sh
