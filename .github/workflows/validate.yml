# Renders and schema-validates every kustomization in infra/.
#
# This is the check that Renovate and the homelab-ops update-review job gate
# on. Before it existed this repo had no workflows at all, so Renovate's
# automergeType 'branch' waited forever for a status that never appeared and
# no dependency commit ever landed -- while ArgoCD auto-synced main to prod.
# Design: docs/plans/2026-09-20-fleet-update-automation.md
name: validate

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: nix develop -c bash -e {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # kustomize, helm and kubeconform come from the flake's dev shell (flake.nix): the versions
      # `nix develop` gives on a laptop and in the developer bot's workbench.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tool versions
        run: kustomize version && helm version --short && kubeconform -v

      - name: Build and validate manifests
        run: ./scripts/validate-manifests.sh
