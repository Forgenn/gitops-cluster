# Targets the data-plane Envoy proxy pods by their stable labels (the Deployment name
# itself has a config-hash suffix that changes on redeploy, e.g.
# envoy-envoy-gateway-envoy-gateway-9dbc5803). minAvailable: 1 with 2 replicas (see
# values/values.yaml) allows draining one node at a time without ever taking down all
# ingress -- previously a single-replica deployment with no PDB meant any node drain or
# eviction on the node holding it dropped all external cluster access.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: envoy-gateway-proxy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gateway-name: envoy-gateway
      gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway
