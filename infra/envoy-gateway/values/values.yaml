# Controller itself was single-replica with no PDB (separate from the data-plane
# proxy HA'd earlier -- see envoy-proxy.yaml).
#
# Keep this at ONE replica. Envoy Gateway's leader election gates the
# watch/translate pipeline, NOT the xDS gRPC server: a standby replica still
# accepts envoy data-plane streams and serves its own (stale or divergent)
# snapshot. With 2 replicas we observed (2026-10-25, during the
# resources.monoderobox.dev rollout) envoy pods pinned to different replicas
# holding DIFFERENT listener configs: fresh TLS connections got
# `filter_chain_not_found` for SNIs other pods served fine (loomie, vault,
# resources), while existing long-lived connections (browsers) kept working —
# so the gateway was silently broken for new connections depending on which
# envoy pod answered. Single replica = single translator = one snapshot.
deployment:
  replicas: 1

provider:
  kubernetes:
    envoyService:
      # This sets the type of the data plane service to LoadBalancer.
      type: LoadBalancer
      externalTrafficPolicy: Local
      annotations:
        # This tells MetalLB to assign a specific IP address. NOT WORKING
        metallb.io/load-balancer-ip: "192.168.1.201"
