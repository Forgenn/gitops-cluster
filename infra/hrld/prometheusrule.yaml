# hrld alerts. Every rule carries namespace: hrld (from the scrape) and a short summary
# for the telegram.short template. Metrics: hrld repo src/obs/metrics.ts.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hrld-alerts
  namespace: hrld
  labels:
    app: kube-prometheus-stack
    release: prometheus
spec:
  groups:
    - name: hrld.rules
      rules:
        - alert: HrldDown
          # No scrape at all (pod gone, crashlooping, or the metrics port blocked).
          expr: absent(up{job="hrld", namespace="hrld"} == 1)
          for: 10m
          labels:
            severity: warning
            namespace: hrld
          annotations:
            summary: "hrld is down."
            description: "Prometheus has not scraped hrld for 10 minutes; the Matrix bots are not answering."
        - alert: HrldTransactionsFailing
          # A failing transaction is replayed by the homeserver and holds back every event
          # after it: the bots are deaf while this fires.
          expr: sum by (namespace) (increase(hrld_transactions_total{outcome="error"}[10m])) > 0
            unless sum by (namespace) (increase(hrld_transactions_total{outcome="ok"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            namespace: hrld
          annotations:
            summary: "hrld is failing every appservice transaction."
            description: "Events are held back by the homeserver until a transaction succeeds. Check the hrld logs (msg: transaction handling failed)."
        - alert: HrldRepliesFailing
          # Replies that ended in a notice instead of an answer: the model failed (unanswered),
          # the room key never came (undecryptable), or the homeserver refused it (rejected).
          expr: sum by (namespace, bot, outcome) (increase(hrld_replies_total{outcome!="sent"}[1h])) >= 3
          labels:
            severity: warning
            namespace: hrld
          annotations:
            summary: "hrld bot {{ $labels.bot }}: {{ $value | humanize }} replies {{ $labels.outcome }} in the last hour."
            description: "unanswered: model/OpenRouter errors. undecryptable: E2EE keys not arriving. rejected: the homeserver refused the reply."
        - alert: HrldHomeserverUnreachable
          expr: hrld_homeserver_ping_ok == 0
          for: 10m
          labels:
            severity: warning
            namespace: hrld
          annotations:
            summary: "hrld cannot ping the homeserver."
            description: "The appservice ping to Tuwunel has failed for 10 minutes; queued events are not being flushed."
        - alert: HrldCryptoRequestsFailing
          expr: sum by (namespace, bot) (increase(hrld_crypto_request_failures_total[30m])) > 5
          labels:
            severity: warning
            namespace: hrld
          annotations:
            summary: "hrld bot {{ $labels.bot }}: E2EE requests keep failing."
            description: "Key uploads/queries/claims to the homeserver are failing; encrypted rooms may stop decrypting. Check the logs (msg: crypto request failed)."
