apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrld
  namespace: hrld
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hrld
  # One replica: the E2EE crypto store is local SQLite only, so hrld cannot run twice.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hrld
    spec:
      enableServiceLinks: false
      # On shutdown each bot's SQLite does a TRUNCATE checkpoint, which can wait on
      # Litestream's read lock (up to the 5 s busy timeout per database).
      terminationGracePeriodSeconds: 120
      # Litestream as a NATIVE sidecar (restartPolicy: Always): it starts before hrld and
      # stops after it, and its readiness does not count toward the pod's, so a backup
      # failure never takes the bots off the Service. Replicates /data/*.sqlite only; the
      # crypto store (/data/crypto) is excluded on purpose (hrld docs/runbooks/restore.md).
      # Holds only the bucket credentials; never mount the appservice or OpenRouter secrets here.
      initContainers:
        - name: litestream
          image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
          restartPolicy: Always
          args: ["replicate", "-config", "/etc/litestream/litestream.yml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: hrld-litestream
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream
              readOnly: true
            - name: litestream-tmp
              mountPath: /tmp
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hrld
          image: registry.monederobox.dev/hrld/hrld:b307816@sha256:7d44b4ad57dd7c122fe056e2f31b1f49b287a27d86927a9c2d65ad9d3eeb6098
          env:
            - name: HRLD_CONFIG
              value: /etc/hrld/hrld.yaml
          ports:
            - name: appservice
              containerPort: 9000
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/hrld
              readOnly: true
            - name: appservice
              mountPath: /secrets/appservice
              readOnly: true
            - name: openrouter
              mountPath: /secrets/openrouter
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: litestream-config
          configMap:
            name: hrld-litestream-config
        - name: litestream-tmp
          emptyDir: {}
        - name: config
          configMap:
            name: hrld-config
        - name: appservice
          secret:
            secretName: hrld-appservice
            defaultMode: 0440
        - name: openrouter
          secret:
            secretName: hrld-openrouter
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: hrld-data
        - name: tmp
          emptyDir: {}
