apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hrld-appservice
  namespace: hrld
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: hrld-appservice
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: as_token
      remoteRef:
        key: /hrld/AS_TOKEN
    - secretKey: hs_token
      remoteRef:
        key: /hrld/HS_TOKEN
  refreshInterval: 1h
---
# H0 reuses the OpenRouter key Hermes uses (same account, same Guardrail).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hrld-openrouter
  namespace: hrld
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: hrld-openrouter
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api_key
      remoteRef:
        key: /hermes/OPENROUTER_API_KEY
  refreshInterval: 1h
