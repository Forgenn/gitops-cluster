apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hrld-appservice
  namespace: hrld
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: hrld-appservice
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: as_token
      remoteRef:
        key: /hrld/AS_TOKEN
    - secretKey: hs_token
      remoteRef:
        key: /hrld/HS_TOKEN
  refreshInterval: 1h
---
# H0 reuses the OpenRouter key Hermes uses (same account, same Guardrail).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hrld-openrouter
  namespace: hrld
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: hrld-openrouter
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api_key
      remoteRef:
        key: /hermes/OPENROUTER_API_KEY
  refreshInterval: 1h
---
# Z.AI's GLM (Coding Plan): points at the key loomie used, kept in one place in Infisical.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hrld-glm
  namespace: hrld
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: hrld-glm
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api_key
      remoteRef:
        key: /loomie/GLM_API_KEY
  refreshInterval: 1h
---
# Claude through Claude Code, on the Claude subscription: the long-lived token Hermes already uses
# (`claude setup-token`), read from the same Infisical entry rather than copied.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hrld-claude
  namespace: hrld
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: hrld-claude
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: /hermes/CLAUDE_CODE_TOKEN
  refreshInterval: 1h
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-credentials
  namespace: hrld
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: registry-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "registry.monederobox.dev": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: /zot/REGISTRY_USERNAME
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: /zot/REGISTRY_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
  refreshInterval: 1h
---
# hrld's own Pocket ID client (client credentials) for MCP servers, e.g. loomie's /mcp.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hrld-mcp
  namespace: hrld
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: hrld-mcp
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_id
      remoteRef:
        key: /hrld/POCKET_ID_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: /hrld/POCKET_ID_CLIENT_SECRET
  refreshInterval: 1h
---
# The API's static token, for operator scripts (imports, memory rollback drills): generated in the
# cluster once, never stored elsewhere. It cannot decide approvals or change models (those need Pol).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hrld-api-token
  namespace: hrld
spec:
  length: 48
  noUpper: false
  allowRepeat: true
  symbolCharacters: ""
  symbols: 0
  digits: 12
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hrld-api-token
  namespace: hrld
spec:
  refreshInterval: "0"
  target:
    name: hrld-api-token
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hrld-api-token
