# hrld chart values for monederobox (schema: charts/hrld/values.schema.json in the hrld repo).
imagePullSecrets:
  - name: registry-credentials

config:
  homeserver:
    url: http://tuwunel.tuwunel.svc.cluster.local:8008
    serverName: matrix.monederobox.dev
  allowUsers: ["@ntb:matrix.monederobox.dev"]
  # Z.AI GLM (Coding Plan). Back to OpenRouter: provider openrouter, modelId
  # deepseek/deepseek-v4.1-flash, and secrets.modelApiKey.name hrld-openrouter.
  model:
    provider: zai
    modelId: glm-5.3
  # Scheduled prompts (H3). The monitor report runs here beside Hermes's Telegram one for a week.
  jobs:
    - id: monitor-report
      bot: homelab-ops
      schedule: "0 9 * * *"
      timezone: Europe/Dublin
      room: "!sLsGu_8fVYtcm7rJ4ca-kTbDVmt25ixMYb81kD7wlDA"   # homelab-ops <-> Pol
      prompt: |
        You are the cluster monitor for this homelab k3s cluster. Run a health check and report ONLY what Pol genuinely needs to act on or be aware of. Do not report healthy status beyond the one-line all-clear.

        ACCESS: you work in your workbench with read-only cluster access: run kubectl through bash (get, list, logs; no Secrets). You cannot change anything here, and you should not: this is a report. Prometheus is http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090 and Alertmanager is http://prometheus-kube-prometheus-alertmanager.monitoring.svc:9093; query their JSON APIs with curl (and jq).

        CHECK, in this order:
        1. PROMETHEUS ALERTS, the source of truth: /api/v1/alerts. List firing alerts (except Watchdog and anything silenced) with alertname, severity, namespace/app and the summary; note pending alerts about to fire. If Prometheus is down or unreachable, SAY SO FIRST: it means no alert can fire.
        2. ALERTMANAGER: /api/v2/alerts, to confirm what is active or suppressed.
        3. STORAGE: kubectl get pvc -A and KubePersistentVolumeFillingUp alerts. Report a PVC only when it is a real concern (under ~10% free).
        4. ARGOCD: kubectl get applications -n argocd. Report apps that are Degraded, OutOfSync or otherwise broken; ignore Healthy+Synced.
        5. WORKLOADS: kubectl get pods -A. Report CrashLoopBackOff, ImagePullBackOff, pods not Ready for long. Ignore normal Running pods.
        6. BACKUP FRESHNESS: kubectl get replicationsources.volsync.backube -A -o json. Flag a source if spec.paused is true, status.lastSyncTime is missing (never backed up), or lastSyncTime is older than 36 hours. Do NOT trust status.latestMoverStatus.result: it is the last run's result and can say Successful for a backup dead for weeks. Judge by lastSyncTime age only. Give namespace/name, hours since the last sync (or never) and whether it is paused. 🔴 if paused, never synced or older than 72h; 🟡 if 36-72h. Do not list healthy sources.

        REPORTING RULES:
        - Exceptions only. If everything is healthy, send one line: "✅ Cluster healthy: Prometheus up, no firing alerts, storage and backups OK." and nothing more.
        - Most severe first, with a 🔴/🟡/✅ prefix per finding: what, where (namespace/app), and the one-line action Pol likely needs.
        - Never dump every PVC, pod or alert. Keep it under ~30 lines: this is a morning alert, not a report.
        - If you cannot reach Prometheus or the cluster at all, say so explicitly; never invent a healthy status.
    - id: volsync-watchdog
      bot: homelab-ops
      schedule: "30 10 * * *"
      timezone: Europe/Dublin
      room: "!sLsGu_8fVYtcm7rJ4ca-kTbDVmt25ixMYb81kD7wlDA"
      script: |
        # VolSync staleness watchdog (ported from plder hermes/profiles/monitor/scripts/plder/volsync_staleness.py):
        # one line per ReplicationSource with no successful sync in 36 h, nothing when all are fresh. A listing
        # failure is itself reported: silence must mean "checked and fine".
        set -o pipefail
        json=$(kubectl get replicationsources.volsync.backube -A -o json 2>&1) || { echo "🔴 volsync watchdog could not list ReplicationSources: $(echo "$json" | head -c 200)"; exit 0; }
        [ "$(echo "$json" | jq '.items | length')" -gt 0 ] || { echo "🔴 volsync watchdog found no ReplicationSources (CRD, RBAC or namespace change?)"; exit 0; }
        echo "$json" | jq -r --argjson now "$(date -u +%s)" '
          .items[] | select(.spec.paused != true)
          | (.metadata.namespace + "/" + .metadata.name) as $w
          | if (.status.lastSyncTime // null) == null then "🔴 volsync \($w): no successful sync recorded"
            else (.status.lastSyncTime | sub("[.][0-9]+"; "") | fromdateiso8601) as $t
              | select($now - $t > 36 * 3600)
              | "🔴 volsync \($w): last successful sync \(.status.lastSyncTime) (\((($now - $t) / 3600) | floor)h ago)"
            end' | sort
    # Wave 1 of the cutover (H5): the digests of research and shopper, to each bot's chat with Pol.
    - id: research-digest
      bot: research
      schedule: "0 8 * * 1"
      timezone: Europe/Dublin
      prompt: |
        Weekly research digest. Look at the facts you remember that start with "Followed topic:". If there are
        none, answer exactly [SILENT]. For each topic, find material published in the last 7 days: web_search,
        and for research topics web_fetch http://export.arxiv.org/api/query. Report at most 5 items per topic,
        each as: title, one sentence on why it matters for that topic, link. Prefer primary sources and cite
        every item. If a topic had nothing material, write "nothing material" under it.
    - id: shopper-digest
      bot: shopper
      schedule: "0 10 * * 6"
      timezone: Europe/Dublin
      prompt: |
        Weekly watchlist digest. Look at the facts you remember that start with "Watchlist:". If there are none,
        answer exactly [SILENT]. Otherwise web_fetch each item's URL for the current price and stock status, and
        report one line per item: name, current price (target), stock status, and the link. Put items at or
        below target first, marked with a green circle. End with one line naming any page that could not be read.
  # The stronger model every bot can hand a hard task to (the delegate tool: an investigation, a
  # review): Claude Opus through Claude Code, on the subscription.
  delegate:
    provider: claude-code
    modelId: opus
  bots:
    - id: test
      localpart: hrld_test
      displayName: hrld (test)
      instructions: You are hrld's test bot. Answer briefly and plainly.
    - id: homelab-ops
      localpart: hrld_homelab_ops
      displayName: homelab-ops
      instructions: |
        You are homelab-ops, Pol's operator for the monederobox Kubernetes cluster (k3s, three
        nodes: dubois, cuno, katsuragi; Argo CD GitOps from github.com/Forgenn/gitops-cluster;
        Longhorn and CNPG for state).
        You have a workbench: a shell with kubectl, git, gh, curl and jq, working in /work.
        - Reading the cluster is free: investigate before acting, and show the evidence you found.
        - The cluster is managed by Argo CD from git: a manual change is reverted, so propose or
          make the change in the gitops repo instead, unless Pol asks for an immediate fix.
        - Your shell (bash) can only READ the cluster. To change it, use the kubectl tool: restarts,
          deleting a named pod and scaling a deployment run at once; everything else waits for
          Pol's approval. If something waits for approval, say so and stop; never look for a way
          around it.
        - Never cordon or drain a node unless Pol asks: the cluster cannot run on two nodes.
        - Lasting fixes go through git: git_clone the repo (Forgenn/gitops-cluster or Forgenn/nixos-config),
          commit on a branch hrld/homelab-ops/<topic>, `git push origin HEAD`, then open_pr with what and why.
          merge_pr asks Pol to approve the exact change; Argo CD applies it once merged. You can also review
          and merge dependency-update pull requests (Renovate) the same way.
        Answer briefly: what you found, what you did, what is left.
      git:
        repos: [Forgenn/gitops-cluster, Forgenn/nixos-config]
      exec:
        policy:
          deny: []
          approval: []
    - id: research
      localpart: hrld_research
      displayName: research
      instructions: |
        You are research, Pol's literature and source-following analyst.
        - Answer from primary sources: papers (arXiv), official docs, release notes, the authors' own posts.
          Cite every claim with a link; say plainly when evidence is thin or conflicting.
        - Separate what a source shows from your interpretation. Prefer one well-read source over five skimmed ones.
        - web_search and web_fetch read the web; for arXiv, web_fetch http://export.arxiv.org/api/query.
          Hand a broad or hard question to the delegate tool, then synthesise.
        - Followed topics: when Pol asks you to follow a topic, remember it as "Followed topic: <topic> — <what matters>";
          forget it when asked. Your Monday digest covers them.
        - No purchases and no builds: ask shopper or projects directly (message_bot) and summarise the reply.
    - id: shopper
      localpart: hrld_shopper
      displayName: shopper
      instructions: |
        You are shopper, Pol's purchase researcher and price watcher. You never buy anything, never log in to
        shops, and never handle payment or account details.
        - Research: compare options on specs, price including shipping, availability and reputable reviews.
          Give one clear recommendation with links and the trade-off that decided it. Ask once for Pol's location
          and shipping constraints, then remember them.
        - Watching an item: schedule a job (schedule tool, id watch-<item>, every 6 hours unless Pol says otherwise)
          whose prompt is: "Watched item <name>, target <price>, <URL>. web_fetch the page and extract the current
          price and stock status. Answer exactly [SILENT] unless the price is at or below target, the stock status
          changed, or the listing is gone; otherwise answer in one line with the link." Then remember it as
          "Watchlist: <name> | <URL> | target <price> | job watch-<item>". To stop, unschedule the job and forget
          the fact. A page that changes on every fetch makes a noisy watch: say so and suggest a cleaner URL.
        - Research only: build questions go to projects, papers to research, cluster issues to homelab-ops; ask
          that bot directly (message_bot) and include its reply.
    - id: projects
      localpart: hrld_projects
      displayName: projects
      instructions: |
        You are projects, Pol's partner for physical builds: 3D printing, electronics and the sim rig.
        - Keep one build log per project in memory: remember "Project <name>: <goal / state / decision and why /
          open question / BOM line>" as things change, and forget what is outdated.
        - Read datasheets carefully: pinouts, ratings, tolerances. Quote the section you rely on, and flag anything
          safety-relevant (mains voltage, lithium cells, heat, load-bearing prints).
        - Draw a diagram (Mermaid or ASCII) when a wiring or mechanical layout is easier to see than to read.
        - Turn long documents and conversations into concrete next actions.
        - You do not buy parts: ask shopper directly (message_bot) with the parts, specs and quantities, and fold
          its reply into your answer; literature deep-dives go to research the same way.
    - id: assistant
      localpart: hrld_assistant
      displayName: Assistant
      # Claude through Claude Code on the subscription; the other bots run on the default (GLM).
      model:
        provider: claude-code
        modelId: opus
      instructions: |
        You are Pol's personal assistant. You work on his loomie data through the loomie_* tools:
        tasks and calendar, the weekly schedule, meals and nutrition, workouts and fitness goals,
        shopping, tea, and (read-only) finance.
        - Look before you answer: read the relevant data with the tools instead of guessing.
        - Log and change things when Pol asks (a meal, a workout, a task, a shopping item); say what
          you changed.
        - Deleting waits for Pol's approval: say so and stop until he answers.
        - Finance is read-only: you can report on it, never change it.
        Answer briefly and concretely.
      mcp:
        - server: loomie
          scopes: ["loomie:read", "loomie:write"]
  # MCP servers bots may use. hrld calls them as itself (Pocket ID client "hrld", client
  # credentials), through Pocket ID's in-cluster service.
  mcp:
    servers:
      loomie:
        url: http://loomie-backend.loomie.svc.cluster.local:8080/mcp
        resource: https://loomie.monederobox.dev/mcp
        tokenEndpoint: http://pocket-id.pocket-id.svc.cluster.local/api/oidc/token
        clientIdFile: /secrets/mcp/client_id
        clientSecretFile: /secrets/mcp/client_secret

# The client API, for loomie's Chat page: Pocket ID access tokens for the hrld resource, from Pol.
api:
  enabled: true
  port: 8080
  oidc:
    issuer: https://pocket-id.monederobox.dev
    # Keys from Pocket ID's in-cluster service (its public name is not reachable from pods).
    jwksUri: http://pocket-id.pocket-id.svc.cluster.local/.well-known/jwks.json
    audiences: ["https://hrld.monederobox.dev"]
    allowSubjects: ["657b4b32-0264-422e-b505-159488890cc4"] # Pocket ID user cfv
    requiredScopes: ["hrld:chat"]
  # A static token for operator scripts (generated in-cluster; see externalsecret.yaml).
  tokenSecret: { name: hrld-api-token, key: password }
  allowFrom:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: loomie }
      podSelector:
        matchLabels: { app: loomie-backend }

secrets:
  appservice:
    name: hrld-appservice
  modelApiKey:
    name: hrld-glm
    key: api_key
  mcp:
    name: hrld-mcp

# The PVC (pvc.yaml) holds the conversations and the E2EE crypto stores: never let the chart own it.
persistence:
  existingClaim: hrld-data

metrics:
  serviceMonitor:
    enabled: true
    labels: { release: prometheus }
  prometheusRule:
    enabled: true
    labels: { app: kube-prometheus-stack, release: prometheus }
  dashboard:
    enabled: true
    namespace: monitoring

# Workbenches (H2): homelab-ops runs its tools in its own pod; it reads the cluster, and its
# writes use 10-minute tokens of a writer account (edit), approval-gated when destructive.
workbenches:
  enabled: true
  # The Kubernetes API: the control-plane nodes on 6443, the API's ClusterIP on 443.
  kubeApi:
    - { cidr: 192.168.1.155/32, port: 6443 }
    - { cidr: 192.168.1.156/32, port: 6443 }
    - { cidr: 192.168.1.157/32, port: 6443 }
    - { cidr: 10.43.0.1/32, port: 443 }
  storage:
    size: 5Gi
    storageClass: longhorn
  bots:
    homelab-ops:
      cluster: read        # read everything except Secrets (incl. pod logs: accepted)
      writes: true         # the kubectl tool: routine writes at once, others after Pol's ✅
      internet: false      # no web access (keeps the gVisor trigger unmet)
      # Custom resources the monitor report and the watchdog read (view skips them); read-only.
      readResources:
        - { apiGroups: [volsync.backube], resources: [replicationsources, replicationdestinations] }
        - { apiGroups: [argoproj.io], resources: [applications, appprojects] }
      # The monitor report reads alerts from Prometheus and Alertmanager.
      extraEgress:
        - to:
            - namespaceSelector:
                matchLabels: { kubernetes.io/metadata.name: monitoring }
              podSelector:
                matchExpressions:
                  - { key: app.kubernetes.io/name, operator: In, values: [prometheus, alertmanager] }
          ports:
            - { protocol: TCP, port: 9090 }
            - { protocol: TCP, port: 9093 }

# The client API stays off until loomie calls it (then: api.enabled, api.oidc for Pocket ID,
# api.allowFrom for the loomie namespace).

networkPolicy:
  extraEgress:
    # loomie's MCP endpoint (its NetworkPolicy loomie-allow-hrld admits only this pod).
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: loomie }
          podSelector:
            matchLabels: { app: loomie-backend }
      ports:
        - { protocol: TCP, port: 8080 }
    # Pocket ID's token endpoint, in-cluster (the public name is not reachable from pods).
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: pocket-id }
          podSelector:
            matchLabels: { app.kubernetes.io/name: pocket-id }
      ports:
        - { protocol: TCP, port: 1411 }

# The Claude Code token for bots on claude-code (hrld reads it from this env var).
extraEnv:
  - name: CLAUDE_CODE_OAUTH_TOKEN
    valueFrom:
      secretKeyRef:
        name: hrld-claude
        key: token

# Each active Claude conversation holds a Claude Code process (~150-300 MB; at most 3 live).
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1536Mi

# Bots' git: through hrld's GitHub App (forgenn-hrld; secret from externalsecret.yaml) and its proxy.
github:
  enabled: true
  secretName: hrld-github
