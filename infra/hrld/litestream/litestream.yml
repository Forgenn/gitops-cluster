# Continuous replication of hrld's conversation databases (/data/<bot>.sqlite, Pi Durable),
# hrld repo docs/superpowers/plans/2026-10-03-hrld-h1b-observability.md, Task 4.
# NOT recursive: /data/crypto (the E2EE stores) is deliberately left out -- restoring an
# old crypto store breaks encryption for good (hrld docs/runbooks/restore.md).
# The replica is NOT encrypted (Litestream 0.5 has no client-side encryption); the
# databases hold decrypted message text. Accepted by Pol on 2026-10-03, same as Hermes.
# Pi checkpoints PASSIVE while running and TRUNCATE on clean shutdown, so every restart
# starts a new generation (a full snapshot); that is expected.
snapshot:
  interval: 24h
  retention: 168h
dbs:
  - dir: /data
    pattern: "*.sqlite"
    recursive: false
    watch: true
    meta-dir: /data/.litestream
    replica:
      type: s3
      bucket: revachol
      path: litestream/hrld
      endpoint: https://hel1.your-objectstorage.com
      region: hel1
      force-path-style: true
