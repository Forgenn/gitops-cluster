apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hrld-litestream
  namespace: hrld
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: hrld-litestream
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # The same bucket credentials as Hermes' Litestream. Mounted ONLY in the litestream sidecar.
    - secretKey: LITESTREAM_ACCESS_KEY_ID
      remoteRef:
        key: /hetzner/revachol-bucket/ACCESS_KEY
    - secretKey: LITESTREAM_SECRET_ACCESS_KEY
      remoteRef:
        key: /hetzner/revachol-bucket/ACCESS_SECRET_KEY
  refreshInterval: 1h
