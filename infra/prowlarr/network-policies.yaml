# NetworkPolicies — ingress only, mirrors infra/loomie/network-policies.yaml.
#
# Posture: default-deny ingress namespace-wide, then explicitly allow:
#   1. envoy-gateway -> prowlarr only (the httproute backend; flaresolverr,
#      which runs in this same namespace, stays internal-only and is
#      reached by prowlarr via intra-namespace traffic)
#   2. any prowlarr-ns pod -> any prowlarr-ns pod (prowlarr <-> flaresolverr)
#   3. lidarr/readarr -> prowlarr:9696 (the *arr apps query Prowlarr-proxied
#      indexers after Prowlarr's Application sync writes them)
#
# Prowlarr itself reaches the *arr apps' APIs (Application indexer sync):
# the allow rules for that live in infra/lidarr and infra/readarr.
#
# No CNPG cluster and no live ServiceMonitor in this namespace.
# Egress is left open, matching loomie's pass-1 posture.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prowlarr-default-deny-ingress
  namespace: prowlarr
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prowlarr-allow-from-envoy-gateway
  namespace: prowlarr
spec:
  podSelector:
    matchLabels:
      app: prowlarr
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prowlarr-allow-intra-namespace
  namespace: prowlarr
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prowlarr
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prowlarr-allow-from-arr-apps
  namespace: prowlarr
spec:
  podSelector:
    matchLabels:
      app: prowlarr
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: ["lidarr", "readarr"]
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["lidarr", "readarr"]
      ports:
        - protocol: TCP
          port: 9696
