apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: prowlarr-config
spec:
  # Paused 2026-11-28: the 02:00 UTC restic job fails (exit 3, unreadable LSIO asp
  # key files despite runAsGroup 1000) and volsync's ~1min retry loop churned the
  # source PVC's Longhorn attach cycle hard enough to fault replicas for hours
  # after the 2026-11-27 power event (and bloats the restic repo ~1 snapshot per
  # retry). Unpause only after the source file permissions are fixed, by
  # removing this line in git (a live paused flag is invisible to ArgoCD).
  paused: true
  sourcePVC: prowlarr-config
  trigger:
    schedule: "0 2 * * *"
  restic:
    copyMethod: Direct
    # runAsGroup matches this app's PGID so the mover can read LSIO's mode-660 ASP.NET
    # key files without needing DAC_OVERRIDE (see infra/lidarr for the full explanation).
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 1000
    pruneIntervalDays: 7
    cacheCapacity: 5Gi
    repository: prowlarr-config-restic-config
    unlock: unlock-2
    retain:
      daily: 7
      within: 3d
