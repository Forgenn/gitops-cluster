# ZFS-backed RWX claim for the immich library (content tier). Migrated immich photos
# from Longhorn (state tier) to the ZFS/NFS content tier — frees ~300Gi Longhorn reserve.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-zfs
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 120Gi
  storageClassName: zfs-generic-nfs-csi
