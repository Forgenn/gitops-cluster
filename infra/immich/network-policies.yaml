# NetworkPolicies — ingress only, mirrors infra/loomie/network-policies.yaml.
#
# Posture: default-deny ingress namespace-wide, then explicitly allow:
#   1. envoy-gateway -> immich-server (the only externally-reachable component;
#      immich-machine-learning / immich-valkey / immich-db stay internal-only)
#   2. any immich pod -> any immich pod (server <-> machine-learning, valkey,
#      CNPG db)
#   3. cnpg controller (in `cnpg` ns) -> immich-db CNPG cluster pods
#
# Egress is left open, matching loomie's pass-1 posture.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-default-deny-ingress
  namespace: immich
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-allow-from-envoy-gateway
  namespace: immich
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/instance: immich
      app.kubernetes.io/name: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-allow-intra-namespace
  namespace: immich
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: immich
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-allow-cnpg-operator
  namespace: immich
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: immich-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg
