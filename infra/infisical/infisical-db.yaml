apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: infisical-cnpg-cluster
spec:
  instances: 3
  # Requests keep this out of BestEffort QoS (first to be OOM-killed under node
  # pressure) -- sized off actual usage (~30m CPU, ~120Mi RSS observed). Limits leave
  # headroom for backup/vacuum spikes. Found via the Opus 5 audit.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  backup:
    barmanObjectStore:
      # URL to hetzner S3 services
      endpointURL: "https://hel1.your-objectstorage.com"
      destinationPath: "s3://revachol/backups/infisical-cnpg-db"
      s3Credentials:
        accessKeyId:
          name: hetzner-backup-bucket-credentials
          key: ACCESS_KEY
        secretAccessKey:
          name: hetzner-backup-bucket-credentials
          key: ACCESS_SECRET_KEY
      data:
        compression: gzip
    retentionPolicy: 60d
  storage:
    # Custom democratic-csi storage class
    storageClass: zfs-generic-nfs-csi
    size: 10Gi
