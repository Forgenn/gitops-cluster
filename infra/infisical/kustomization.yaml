apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: infisical

resources:
  - infisical-db.yaml
  - infisical-db-backup.yaml
  - backup-permission.yaml
  - httproute-internal.yaml
  - secret.yaml
  - network-policies.yaml

helmCharts:
  - name: infisical-standalone
    repo: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    releaseName: infisical
    version: "1.8.0"
    namespace: infisical
    valuesFile: values/values.yaml

# Anchor annotation for argo-cd#7513 (open since 2021): the chart stamps a fresh
# `updatedAt` timestamp on every render, so it must stay in ignoreDifferences --
# but it is the ONLY pod-template annotation, and stripping the last key leaves
# `annotations: {}` on the live side vs no annotations key in the predicted
# state, which ArgoCD reports as a permanent diff. A second, stable annotation
# keeps the map non-empty after `updatedAt` is stripped, so both sides match.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: infisical-infisical-standalone-infisical
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: infisical-infisical-standalone-infisical
      spec:
        template:
          metadata:
            annotations:
              monederobox.dev/diff-anchor: "argo-cd-7513"
