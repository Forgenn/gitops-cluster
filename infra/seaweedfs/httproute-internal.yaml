# resources.monederobox.dev — the chat-files endpoint (loomie task 77289b3a).
#
# Files exchanged with chats (bot-generated reports the user should view, and files the user
# uploads through the loomie chat UI) are stored in SeaweedFS under the filer's
# /chats tree and served here. The filer's HTTP API both serves files with their
# stored Content-Type (HTML renders in the browser) and lists directories, so
# browsing https://resources.monederobox.dev/chats shows everything.
#
# Writes never go through this route (see the SecurityPolicy below): bots and
# loomie-backend upload in-cluster via the seaweedfs-filer service, gated by the
# NetworkPolicies in network-policies.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: resources-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - "resources.monederobox.dev"
  rules:
    # Bare host → the chat-files listing.
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              value: /chats
            statusCode: 302
    - matches:
        - path:
            type: Exact
            value: /chats
        - path:
            type: PathPrefix
            value: /chats/
      filters:
        # These files are bot- or user-authored HTML: keep them in a sandboxed,
        # opaque origin (scripts run, but the document gets no same-origin access
        # to anything else served here). Harmless for non-HTML files.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Content-Security-Policy
                value: sandbox allow-scripts
              - name: X-Content-Type-Options
                value: nosniff
      backendRefs:
        - group: ""
          kind: Service
          name: seaweedfs-filer
          port: 8888
          weight: 1
---
# SecurityPolicy as it is internal (same shape as infra/longhorn/httproute-internal.yaml).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: internal-resources-route
spec:
  targetRefs:
    - group: "gateway.networking.k8s.io"
      name: resources-route
      kind: HTTPRoute
  authorization:
    defaultAction: Deny
    rules:
      # Cluster nodes: pods leave through them (flannel masquerade), so this is how
      # pod traffic arrives. The filer's HTTP API is unauthenticated AND writable,
      # so pods must never reach it through this route — in-cluster they use the
      # seaweedfs-filer service, gated by NetworkPolicy instead. Rules match in
      # order: Deny first.
      - action: Deny
        principal:
          clientCIDRs:
            - 192.168.1.155/32
            - 192.168.1.156/32
            - 192.168.1.157/32
      - action: Allow
        principal:
          clientCIDRs:
            - 100.64.0.0/10
            - 192.168.1.0/24
