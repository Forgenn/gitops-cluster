# NetworkPolicies — ingress only, mirrors infra/loomie/network-policies.yaml.
# Live routes: resources.monederobox.dev (httproute-internal.yaml) → seaweedfs-filer.
# No CNPG cluster, no live ServiceMonitor in this namespace.
#
# NOTE: infra/opencloud has a commented-out (disabled) S3 config pointing at
# seaweedfs-s3.seaweedfs.svc.cluster.local:8333. It is NOT live today, so no
# allow-from-opencloud rule is included here. If that integration is ever
# enabled, add a NetworkPolicy here allowing ingress from the `opencloud`
# namespace on port 8333, or opencloud's storage calls will start failing.
#
# Egress is left open, matching loomie's pass-1 posture.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-default-deny-ingress
  namespace: seaweedfs
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-allow-intra-namespace
  namespace: seaweedfs
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs
---
# resources.monederobox.dev (httproute-internal.yaml): envoy-gateway → filer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-allow-from-envoy-gateway
  namespace: seaweedfs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: filer
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway
      ports:
        - protocol: TCP
          port: 8888
---
# Chat files: who may WRITE into the filer's /chats tree. MCP-only access model
# (user decision 2026-10-25): the ONLY writer is loomie-backend — it serves the MCP
# publish_file tool every bot calls (hrld bots have NO direct filer access: no
# workbench egress, no gateway egress), and it handles the loomie chat attachment
# uploads. The filer API is unauthenticated, so this NetworkPolicy is the only
# gate — keep it to this one pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-allow-chat-file-writers
  namespace: seaweedfs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: filer
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loomie
          podSelector:
            matchLabels:
              app: loomie-backend
      ports:
        - protocol: TCP
          port: 8888
