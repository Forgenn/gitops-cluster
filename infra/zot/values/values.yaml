# Zot Container Registry Configuration

replicaCount: 1

image:
  repository: ghcr.io/project-zot/zot
  tag: v2.1.13

# Persistence for registry storage
persistence: true
pvc:
  create: true
  # 50Gi filled up (6.9% free 2026-10-23, ~0.8%/day). NOTE: k3s v1.35.6 REJECTS
  # volumeClaimTemplates updates (in-place STS resize not enabled), so changing
  # this size alone never applies — Argo just flaps Unknown<->Synced. Converge with:
  #   1. kubectl patch pvc zot-pvc-zot-0 -n zot (storage expansion, longhorn SC allows it)
  #   2. kubectl delete sts zot -n zot --cascade=orphan  (pod+PVC stay up)
  #   3. Argo auto-sync recreates the STS at this size (2026-10-24: done, 100Gi live)
  storage: 100Gi
  storageClassName: longhorn
  accessMode: ReadWriteOnce

# Service configuration
service:
  type: ClusterIP
  port: 5000

# Mount external secrets for authentication
externalSecrets:
  - secretName: zot-htpasswd
    mountPath: /secret/htpasswd
  - secretName: zot-oidc
    mountPath: /secret/oidc

# Auth header for probes (base64 of admin:admin as placeholder, update after setting real password)
# Generate with: echo -n 'admin:yourpassword' | base64
authHeader: ""

# Zot configuration. mountConfig makes the chart mount it at /etc/zot;
# without it zot runs the image's default config, not this one.
mountConfig: true
configFiles:
  config.json: |
    {
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "24h"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "externalUrl": "https://registry.monederobox.dev",
        "auth": {
          "htpasswd": {
            "path": "/secret/htpasswd/htpasswd"
          },
          "openid": {
            "providers": {
              "oidc": {
                "issuer": "https://pocket-id.monederobox.dev",
                "credentialsFile": "/secret/oidc/credentials.json",
                "scopes": ["openid", "profile", "email", "groups"]
              }
            }
          }
        }
      },
      "log": {
        "level": "info"
      },
      "extensions": {
        "search": {
          "enable": true,
          "cve": null
        },
        "ui": {
          "enable": true
        },
        "metrics": {
          "enable": true,
          "prometheus": {
            "path": "/metrics"
          }
        }
      }
    }

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi
