# Envoy serves the Longhorn UI (httproute-internal.yaml). The chart creates no UI
# policy (its template needs ingress.enabled), and the UI proxies /v1 to the
# unauthenticated manager API, so this policy is what closes that path for pods.
# docs/plans/2026-09-29-phase0-stop-the-bleeding.md Task 6c.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-ui-from-envoy
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-ui
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway
      ports:
        - {protocol: TCP, port: 8000}
