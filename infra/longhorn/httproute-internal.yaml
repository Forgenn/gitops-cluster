apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - "longhorn.monederobox.dev"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: longhorn-frontend
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
# SecurityPolicy as it is internal
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: internal-longhorn-route
spec:
  targetRefs:
    - group: "gateway.networking.k8s.io"
      name: longhorn-route
      kind: HTTPRoute
  authorization:
    defaultAction: Deny
    rules:
      # Cluster nodes: pods leave through them (flannel masquerade), so this is how pod
      # traffic arrives. This app has no login of its own (the Longhorn API is fully
      # unauthenticated), so never serve pods. Rules match in order: Deny first.
      # docs/plans/2026-09-29-phase0-stop-the-bleeding.md Task 6 Step 1b.
      - action: Deny
        principal:
          clientCIDRs:
            - 192.168.1.155/32
            - 192.168.1.156/32
            - 192.168.1.157/32
      - action: Allow
        principal:
          clientCIDRs:
            - 100.64.0.0/10
            - 192.168.1.0/24
