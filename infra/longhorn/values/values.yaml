preUpgradeChecker:
  jobEnabled: false
  upgradeVersionCheck: true

persistence:
  # Not production ready
  # dataEngine: "v2"
  defaultClassReplicaCount: 3
  defaultDataLocality: "best-effort"

defaultSettings:
  defaultDataPath: "/var/lib/longhorn-data/"
  # Defaults to "{"v1":"3","v2":"3"}".
  #defaultReplicaCount: "3"

  # Scheduling settings
  disableSchedulingOnCordonedNode: "false"
  replicaSoftAntiAffinity: "true" # Allow replicas on same node if needed
  replicaAutoBalance: "best-effort" # Auto-balance replicas

  # Storage settings
  # Was 100 (zero overcommit tolerance) -- with storageReservedPercentageForDefaultDisk
  # already carving out 15% as an absolute floor, 100% here meant Longhorn refused to
  # *schedule* (promise) more nominal volume capacity than raw-minus-reserved, even
  # though actual physical usage stays well under that (e.g. cuno: 251GiB used of 455GiB
  # raw, 55%, while ScheduledTotal had already hit the 100% ceiling). Blocked a legitimate
  # loomie-db replica rebuild with 181GiB genuinely free on disk. 110% keeps promised
  # capacity capped at roughly disk-size-minus-reserved -- never exceeds physical capacity
  # even in a worst-case simultaneous-full-fill scenario, just stops double-counting the
  # reserved margin on top of a zero-overcommit ceiling.
  storageOverProvisioningPercentage: "110"
  storageMinimalAvailablePercentage: "5"
  storageReservedPercentageForDefaultDisk: "15" # Match your reserved space

  # Node scheduling
  allowVolumeCreationWithDegradedAvailability: "true" # Allow creation even if degraded

  # Replica settings
  replicaReplenishmentWaitInterval: "600" # Wait 10min before creating new replica
  concurrentReplicaRebuildPerNodeLimit: "5"
