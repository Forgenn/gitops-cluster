apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
data:
  # Mounted read-only at /opt/data/config.yaml. To change the model/provider,
  # edit here and restart the deployment. The API key itself never lives here —
  # it comes from the Infisical-backed `hermes-secrets` secret, via env and (for
  # multiplexed profiles) via files read by the `secrets.command` helper below.
  config.yaml: |
    # Non-secret behaviour settings
    model:
      default: deepseek/deepseek-v4-flash-0731
      provider: openrouter
    approvals:
      # smart = human-in-the-loop for destructive commands. `serve` clients get
      # an approval prompt in the desktop app.
      mode: smart
      # On gateway (Telegram) surfaces, a dangerous command is sent to the chat and
      # waits for the user to reply yes/no — manual approval. Add rules so the guardian
      # ESCALATES the most destructive cluster commands to that manual prompt, while
      # everything else stays auto-approved. Read-only commands flow freely.
      smart_policy: |
        Always ESCALATE (never auto-approve or deny on your own) any command that
        mutates the homelab cluster rather than reading it. Specifically every command
        using kubectl or k3s kubectl that deletes (delete pvc/ns/pod --force/--all,
        drain, cordon, scale-to-0), patches or force-applies (patch, apply --force,
        replace --force), or restarts/recreates workloads (rollout restart, delete pods
        to force-recreate); any nixos-rebuild switch / nh os switch on a cluster node;
        and any read or write of Kubernetes secrets (get/create secrets, helm secrets).
        ESCALATE those to the human operator. Commands that only READ state (get,
        describe, list, logs, top, diff --selector) may be APPROVED.
      # Hard-block the unambiguously catastrophic cluster ops unconditionally — even a
      # manual approval prompt cannot run these from the agent:
      deny:
        - "kubectl delete namespace*"
        - "k3s kubectl delete namespace*"
        - "*kubectl* --all --force*"
        - "*k3s kubectl* --all --force*"
    desktop:
      repo_scan_enabled: false
    # Serve named profiles from the one gateway. Required for a bot's own cron:
    # without multiplex only the root cron store ticks, so a profile routine runs
    # as the ROOT agent with the root persona (cron/scheduler_provider.py).
    # Allowlisted, so each new bot is an explicit, reviewed addition.
    gateway:
      multiplex_profiles: true
      multiplex_profile_allowlist:
        - monitor
      profile_routes:
        - name: monitor-topic
          platform: telegram
          chat_id: "7850573137"
          thread_id: "5332"
          profile: monitor
    # Credentials for agent turns. Under multiplex a profile's secret scope is
    # authoritative (no os.environ fallback), so the pod's envFrom is invisible to
    # it. This helper feeds the scope from the files the Deployment mounts at
    # /etc/hermes-profile-secrets. It runs with the profile's private environment
    # (not the pod env, and no PATH), hence file reads and shell builtins only.
    # Every served profile needs the same block in its own config.yaml.
    secrets:
      command:
        enabled: true
        command: 'for f in /etc/hermes-profile-secrets/*; do IFS= read -r v < "$f" || [ -n "$v" ]; printf "%s=%s\n" "${f##*/}" "$v"; done'
  # Mounted at /opt/data/home/.ssh/config (the app user's HOME, uid 10000), where
  # the gateway-running user can actually read it. Not sensitive on its own -- just
  # host aliases and identity-file paths; the actual keys come from the hermes-secrets
  # Secret and are copied into /opt/data/home/.ssh by the ssh-key-perms initContainer.
  ssh_config: |
    Host github.com
      User git
      IdentityFile /opt/data/home/.ssh/git_deploy_key
      IdentitiesOnly yes
      StrictHostKeyChecking accept-new

    # nixos-config repo uses its OWN deploy key (GitHub deploy keys are per-repo).
    # Match on the unique host, so pushes to this repo use the nixos key and pushes
    # to gitops-cluster still use git_deploy_key.
    Host github.com-nixos
      HostName github.com
      User git
      IdentityFile /opt/data/home/.ssh/nixos_deploy_key
      IdentitiesOnly yes
      StrictHostKeyChecking accept-new

    # plder repo uses its OWN deploy key (GitHub deploy keys are per-repo). Match
    # on the unique host, so the config-sync initContainer's clone uses the plder
    # key without touching git_deploy_key or nixos_deploy_key.
    Host github.com-plder
      HostName github.com
      User git
      IdentityFile /opt/data/home/.ssh/plder_deploy_key_read
      IdentitiesOnly yes
      StrictHostKeyChecking accept-new

    Host dolores.home dubois.home cuno.home katsuragi.home
      User hermes-agent
      IdentityFile /opt/data/home/.ssh/fleet_ssh_key
      IdentitiesOnly yes
      StrictHostKeyChecking accept-new