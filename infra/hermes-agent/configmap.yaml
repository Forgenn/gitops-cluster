apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
# Infrastructure only. The agent's root config.yaml is declared in Forgenn/plder
# (hermes/root/config.yaml) and installed onto the PVC by the profile-sync
# initContainer. Do not re-add a config.yaml key here: a copy in this repo is a
# mirror that drifts, and mounting it over /opt/data/config.yaml masks the
# synced file.
data:
  # Mounted at /opt/data/home/.ssh/config (the app user's HOME, uid 10000), where
  # the gateway-running user can actually read it. Not sensitive on its own -- just
  # host aliases and identity-file paths; the actual keys come from the hermes-secrets
  # Secret and are copied into /opt/data/home/.ssh by the ssh-key-perms initContainer.
  ssh_config: |
    # The only GitHub SSH identity left: profile-sync's read-only plder clone.
    # Every bot push goes over HTTPS with the GitHub App token (/etc/gitconfig).
    Host github.com-plder
      HostName github.com
      User git
      IdentityFile /opt/data/home/.ssh/plder_deploy_key_read
      IdentitiesOnly yes
      StrictHostKeyChecking accept-new

    Host dolores.home dubois.home cuno.home katsuragi.home
      User hermes-agent
      IdentityFile /opt/data/home/.ssh/fleet_ssh_key
      IdentitiesOnly yes
      StrictHostKeyChecking accept-new