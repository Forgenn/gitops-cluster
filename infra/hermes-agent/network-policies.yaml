# NetworkPolicies — ingress only, mirrors infra/loomie/network-policies.yaml.
#
# NOTE on naming: this repo folder is `hermes-agent` but its kustomization.yaml
# sets `namespace: hermes` for every resource — the live namespace is `hermes`
# (a separate, empty `hermes-agent` namespace also exists in the cluster and
# is not managed by this kustomization; it is left alone).
#
# No CNPG cluster and no live ServiceMonitor in this namespace.
# Egress is left open, matching loomie's pass-1 posture.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-default-deny-ingress
  namespace: hermes
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-allow-from-envoy-gateway
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app: hermes-agent
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway
      # Only the dashboard is routed (httproute.yaml -> 9119). Without a port list
      # this admitted every port, including the API server's 8642.
      ports:
        - protocol: TCP
          port: 9119
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-allow-intra-namespace
  namespace: hermes
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes
