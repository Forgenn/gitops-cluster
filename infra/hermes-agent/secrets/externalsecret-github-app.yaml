# The forgenn-hermes GitHub App (docs/plans/2026-09-29-phase2-github-identity.md Task 3).
# Mounted ONLY in the github-app-token sidecar; the bots see just the 1-hour token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-github-app
  namespace: hermes
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: hermes-github-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: /hermes/GITHUB_APP_ID
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef:
        key: /hermes/GITHUB_APP_INSTALLATION_ID
    - secretKey: key.pem
      remoteRef:
        key: /hermes/GITHUB_APP_PRIVATE_KEY
  refreshInterval: 1h
