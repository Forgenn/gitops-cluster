apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets-homelab-ops
  namespace: hermes
  annotations:
    # OPTIONAL until the operator creates the Infisical path. Until then ESO
    # reports SecretSyncedError, and ArgoCD's built-in ExternalSecret health
    # check turns that into a Degraded Application -- which fires
    # ArgoAppDegraded and masks real problems (it hid a genuine node/storage
    # incident on 2026-09-19). The update-review job is designed to run without
    # the PAT: both repos are public, so it can still read every PR and report;
    # it simply cannot merge. That is the same behaviour as dry_run: true.
    # Remove this annotation if the PAT ever becomes load-bearing.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: hermes-secrets-homelab-ops
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Fine-grained PAT, "only select repositories" = exactly gitops-cluster and
    # nixos-config. Permissions: Contents read/write + Pull requests read/write
    # (both are required to merge a PR).
    #
    # Deliberately its OWN ExternalSecret: if the operator has not created this
    # Infisical path yet, only THIS resource's status shows an error --
    # hermes-secrets and every other credential keep refreshing normally.
    # Optional at the pod level too (deployment.yaml profile-secrets-homelab-ops
    # volume, optional: true).
    #
    # This is homelab-ops rather than the developer bot on purpose: the
    # developer PAT deliberately excludes gitops-cluster, nixos-config and
    # plder, and that boundary stays intact. Merging an infra PR is a cluster
    # operation, so it belongs to the bot that owns cluster operations.
    - secretKey: HOMELAB_OPS_GITHUB_PAT
      remoteRef:
        key: /hermes/HOMELAB_OPS_GITHUB_PAT
  refreshInterval: 1h
