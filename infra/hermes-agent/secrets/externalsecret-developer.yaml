apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets-developer
  namespace: hermes
  annotations:
    # This credential is OPTIONAL until the operator creates the Infisical path:
    # until then ESO reports SecretSyncedError, and ArgoCD's built-in
    # ExternalSecret health check turns that into a Degraded Application --
    # which fires ArgoAppDegraded and masks real problems (it hid a genuine
    # node/storage incident on 2026-09-19). The developer bot is designed to run
    # read-only without the PAT, so a missing one is not an unhealthy app.
    # Remove this annotation if the PAT ever becomes load-bearing.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: hermes-secrets-developer
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Fine-grained PAT, "only select repositories" = every Forgenn repo except
    # gitops-cluster, nixos-config, plder (Task 4 lists them). Deliberately its
    # OWN ExternalSecret: if the operator has not created this Infisical path
    # yet, only THIS resource's status shows an error -- hermes-secrets and
    # every other credential keep refreshing normally. Optional at the pod level
    # too (deployment.yaml profile-secrets-developer volume, optional: true).
    - secretKey: DEVELOPER_GITHUB_PAT
      remoteRef:
        key: /hermes/DEVELOPER_GITHUB_PAT
  refreshInterval: 1h
