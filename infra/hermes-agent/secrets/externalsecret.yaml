apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets
  namespace: hermes
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: hermes-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Model provider (OpenRouter)
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: /hermes/OPENROUTER_API_KEY
    # Dashboard / `hermes serve` basic-auth provider (session login for the
    # desktop Remote Gateway). Trusted-network only: the HTTPRoute SecurityPolicy
    # below additionally restricts this to the tailnet + LAN.
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      remoteRef:
        key: /hermes/DASHBOARD_USERNAME
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      remoteRef:
        key: /hermes/DASHBOARD_PASSWORD
    # Stable HMAC signing secret so dashboard sessions survive pod restarts.
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      remoteRef:
        key: /hermes/DASHBOARD_AUTH_SECRET
    # Deploy key (write access to nixos-config + gitops-cluster only -- registered as a
    # per-repo GitHub deploy key, not a broad personal-account token).
    - secretKey: GIT_DEPLOY_KEY
      remoteRef:
        key: /hermes/GIT_DEPLOY_KEY
    # SSH key for the dedicated, non-sudo `hermes-agent` user on dolores/dubois/cuno/katsuragi.
    - secretKey: FLEET_SSH_KEY
      remoteRef:
        key: /hermes/FLEET_SSH_KEY
    # Telegram: enables the telegram gateway platform + gates access + sets the
    # delivery home channel for scheduled (cron) reports.
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: /hermes/TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_ALLOWED_USERS
      remoteRef:
        key: /hermes/TELEGRAM_ALLOWED_USERS
    - secretKey: TELEGRAM_HOME_CHANNEL
      remoteRef:
        key: /hermes/TELEGRAM_HOME_CHANNEL
  refreshInterval: 1h