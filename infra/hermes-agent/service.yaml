apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: hermes
spec:
  type: ClusterIP
  ports:
    # `hermes serve` / dashboard backend — what the desktop Remote Gateway connects to.
    - name: dashboard
      port: 9119
      targetPort: dashboard
    # OpenAI-compatible API + health (optional; not used by the desktop app).
    - name: api
      port: 8642
      targetPort: api
  selector:
    app: hermes-agent