apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-bucket-restic-config
  namespace: hermes
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: hermes-bucket-restic-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: "s3:https://hel1.your-objectstorage.com/revachol/backups/hermes-agent"
        RESTIC_PASSWORD: "{{ .restic_password }}"
        AWS_ACCESS_KEY_ID: "{{ .aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .aws_secret_access_key }}"
  data:
    - secretKey: restic_password
      remoteRef:
        key: /volsync/restic-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: aws_access_key_id
      remoteRef:
        key: /hetzner/revachol-bucket/ACCESS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: aws_secret_access_key
      remoteRef:
        key: /hetzner/revachol-bucket/ACCESS_SECRET_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
  refreshInterval: 1h