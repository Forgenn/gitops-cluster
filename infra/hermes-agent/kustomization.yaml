apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hermes

resources:
  - namespace.yaml
  - secrets/
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  # NOTE: volsync/restic backups intentionally NOT included yet — see README.
  # The /hermes PVC is empty at first boot; add backup.yaml + backup-restic-config.yaml
  # after first successful run once you've created the /hermes restic secrets in Infisical.