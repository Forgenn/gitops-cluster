apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hermes

resources:
  - namespace.yaml
  - secrets/
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  # Optional nightly backups of the agent's brain (/opt/data) to Hetzner object storage.
  # Requires /hermes/... secrets in Infisical; remove these lines to disable backups.
  - backup-restic-config.yaml
  - backup.yaml