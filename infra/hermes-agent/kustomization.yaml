apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hermes

resources:
  - namespace.yaml
  - secrets/
  - configmap.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - network-policies.yaml
  - network-policy-egress.yaml
  - backup-restic-config.yaml
  - backup.yaml
  - litestream/externalsecret.yaml

# Ships the profile-sync scripts as a generated ConfigMap, not a plain resource:
# the generator appends a content hash to the name, so editing sync.py or
# cron_upsert.py actually rolls the pod (a plain ConfigMap name never changes,
# so the initContainer would keep running stale scripts after an edit).
configMapGenerator:
  # Litestream replication config (docs/plans/2026-09-28-hermes-hardening.md Task 7).
  - name: hermes-litestream-config
    files:
      - litestream.yml=litestream/litestream.yml
  - name: hermes-sync-scripts
    files:
      - sync/sync.py
      - sync/cron_upsert.py
  # Git pre-push guard for the agent (githooks/pre_push.py). Generated, so an edit rolls the pod.
  - name: hermes-githooks
    files:
      - pre-push=githooks/pre_push.py
      - gitconfig=githooks/gitconfig
      - git-credential-developer-pat=githooks/git_credential_developer_pat.py
      - git-credential-github-app=githooks/git_credential_github_app.py
  # GitHub App token minter for the github-app-token sidecar (phase 2 Task 3).
  - name: hermes-github-app
    files:
      - mint_token.py=github-app/mint_token.py
