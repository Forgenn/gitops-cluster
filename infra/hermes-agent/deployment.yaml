apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes
spec:
  # FIXED at 1: Hermes state (/opt/data) is not safe for concurrent writers.
  # Never autoscale or raise the replica count.
  replicas: 1
  selector:
    matchLabels:
      app: hermes-agent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      # The image runs as user `hermes` (UID/GID 10000). fsGroup makes the
      # Longhorn-backed PVC writable by that group.
      securityContext:
        fsGroup: 10000
        runAsNonRoot: true
      initContainers:
        # Ensure /opt/data exists and is owned by the image UID (Longhorn shares
        # are frequently root-owned).
        - name: fix-permissions
          image: nousresearch/hermes-agent:v2026.8.19
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /opt/data
              chown -R 10000:10000 /opt/data || true
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /opt/data
      containers:
        - name: hermes-agent
          image: nousresearch/hermes-agent:v2026.8.19
          # `gateway run` (s6-supervised) brings up both the `hermes serve`
          # dashboard backend on 9119 (what the desktop connects to) and the
          # messaging gateway.
          args: ["gateway", "run"]
          ports:
            - name: dashboard
              containerPort: 9119
              protocol: TCP
            - name: api
              containerPort: 8642
              protocol: TCP
          env:
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_BASIC_AUTH_ENABLED
              value: "true"
            - name: HERMES_UID
              value: "10000"
            - name: HERMES_GID
              value: "10000"
            # OpenRouter key + dashboard basic-auth credentials (from Infisical)
          envFrom:
            - secretRef:
                name: hermes-secrets
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /opt/data/config.yaml
              subPath: config.yaml
              readOnly: true
            # Shared memory for Playwright/browser work.
            - name: shm
              mountPath: /dev/shm
            # Writable scratch while the root fs is read-only.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8642
            initialDelaySeconds: 10
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8642
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: config
          configMap:
            name: hermes-config
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: tmp
          emptyDir: {}