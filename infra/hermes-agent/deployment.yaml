apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-agent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      securityContext:
        fsGroup: 10000
      serviceAccountName: hermes-agent
      # This pod uses the default cluster DNS (kube-system's CoreDNS), which never
      # learned .home -- that's a separate CoreDNS instance from the one serving the
      # LAN (infra/coredns). Not changing dnsPolicy since that'd risk breaking this
      # pod's own in-cluster service-name resolution; pinning statically instead,
      # same fix used everywhere else this DNS gap has come up.
      hostAliases:
        - ip: "192.168.1.155"
          hostnames: ["dubois.home"]
        - ip: "192.168.1.156"
          hostnames: ["cuno.home"]
        - ip: "192.168.1.157"
          hostnames: ["katsuragi.home"]
        - ip: "192.168.1.34"
          hostnames: ["dolores.home"]
      # The image doesn't bundle kubectl -- copy the binary in from a real kubectl
      # image rather than baking a custom image just for this one tool. Real semver
      # tags, matches the cluster's own k3s version. Deliberately not bitnami/kubectl
      # (dropped pinned tags for free/community images in 2025) or registry.k8s.io/kubectl
      # (real tags, but a truly shell-less distroless image -- no cp, can't be used for
      # this copy-out pattern at all). alpine/k8s has both: real tags and a full
      # shell/coreutils, verified live before picking it.
      initContainers:
        - name: kubectl-copy
          image: alpine/k8s:1.35.6
          command: ["cp", "/usr/bin/kubectl", "/kubectl-bin/kubectl"]
          volumeMounts:
            - name: kubectl-bin
              mountPath: /kubectl-bin
        # The pod's fsGroup (needed by the app itself) forces group-read onto
        # Secret-mounted files no matter what defaultMode says -- SSH categorically
        # refuses a group-readable private key. Copy the keys into a plain writable
        # emptyDir, chmod AND chown there (the fsGroup floor doesn't apply), so the
        # app user (uid/gid 10000) can actually read them. These land in
        # /opt/data/home/.ssh (the app's literal HOME), NOT /root/.ssh: the gateway
        # runs as uid 10000 with HOME=/opt/data/home, and /root is drwx------ root-only,
        # so a /root mount was never readable by the process doing git -- the durable
        # fix is to serve the identity from the app's real home on the shared PVC.
        - name: ssh-key-perms
          image: alpine/k8s:1.35.6
          command:
            - sh
            - -c
            - |
              cp /secrets/git-deploy-key/GIT_DEPLOY_KEY /ssh-keys/git_deploy_key
              cp /secrets/fleet-ssh-key/FLEET_SSH_KEY /ssh-keys/fleet_ssh_key
              cp /secrets/nixos-deploy-key/NIXOS_DEPLOY_KEY /ssh-keys/nixos_deploy_key
              chown 10000:10000 /ssh-keys/git_deploy_key /ssh-keys/fleet_ssh_key /ssh-keys/nixos_deploy_key
              chmod 600 /ssh-keys/git_deploy_key /ssh-keys/fleet_ssh_key /ssh-keys/nixos_deploy_key
          volumeMounts:
            - name: git-deploy-key
              mountPath: /secrets/git-deploy-key
              readOnly: true
            - name: fleet-ssh-key
              mountPath: /secrets/fleet-ssh-key
              readOnly: true
            - name: nixos-deploy-key
              mountPath: /secrets/nixos-deploy-key
              readOnly: true
            - name: ssh-keys
              mountPath: /ssh-keys
        # Install Claude Code into a writable emptyDir at boot (same pattern as the
        # kubectl-copy initContainer above). The pod image is frozen and not customised,
        # so a tool that isn't in the image is injected this way -- emptyDir is
        # re-populated on every pod start, so `claude` is always present and needs no
        # manual in-pod npm install after a restart. Mounted into the main container
        # at /opt/tools and prepended to PATH (see env below). Node already ships in the
        # base image, so the claude node CLI runs as-is. Files are chowned to the app
        # user (uid/gid 10000) so the gateway can execute them.
        - name: claude-install
          image: node:24.20.0-alpine3.24
          command:
            - sh
            - -c
            - |
              export PATH=/usr/local/bin:/usr/bin:/bin
              mkdir -p /opt/tools
              npm install -g --prefix /opt/tools @anthropic-ai/claude-code >/dev/null 2>&1 || true
              chown -R 10000:10000 /opt/tools/lib /opt/tools/bin 2>/dev/null || true
              chmod -R a+rX /opt/tools 2>/dev/null || true
          volumeMounts:
            - name: claude-tools
              mountPath: /opt/tools
      containers:
        - name: hermes-agent
          image: nousresearch/hermes-agent:v2026.8.19
          args: ["gateway", "run"]
          ports:
            - name: dashboard
              containerPort: 9119
              protocol: TCP
            - name: api
              containerPort: 8642
              protocol: TCP
          env:
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_BASIC_AUTH_ENABLED
              value: "true"
            - name: HERMES_UID
              value: "10000"
            - name: HERMES_GID
              value: "10000"
            # Claude Code is installed by the claude-install initContainer into an
            # emptyDir at /opt/tools (pinned node npm prefix install). Prepend it to
            # PATH so the gateway and any spawned shells can call `claude` directly.
            - name: PATH
              value: "/opt/tools/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games"
          envFrom:
            - secretRef:
                name: hermes-secrets
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /opt/data/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
            - name: kubectl-bin
              mountPath: /usr/local/bin/kubectl
              subPath: kubectl
              readOnly: true
            # Claude Code install (populated by the claude-install initContainer).
            - name: claude-tools
              mountPath: /opt/tools
            # SSH identity for git: served from the app user's real HOME
            # (/opt/data/home, which the gateway runs under as uid 10000). The
            # ssh_config content and key files are written/mounted fresh here rather
            # than into /root/.ssh (root-only, unreadable by uid 10000 -- where this
            # used to point, which is why git "kept breaking" every restart).
            - name: ssh-config
              mountPath: /opt/data/home/.ssh/config
              subPath: ssh_config
              readOnly: true
            - name: ssh-keys
              mountPath: /opt/data/home/.ssh/git_deploy_key
              subPath: git_deploy_key
              readOnly: true
            - name: ssh-keys
              mountPath: /opt/data/home/.ssh/fleet_ssh_key
              subPath: fleet_ssh_key
              readOnly: true
            # nixos-config uses its own per-repo deploy key (already copied into the
            # same ssh-keys emptyDir by the initContainer above) -- mount it too so
            # pushes to that repo work. Previously it was never mounted at all.
            - name: ssh-keys
              mountPath: /opt/data/home/.ssh/nixos_deploy_key
              subPath: nixos_deploy_key
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
          # Probes were pointed at port 8642 ("api"), but nothing actually binds there --
          # only the dashboard (9119) is confirmed live in the container's own startup
          # log ("HERMES_DASHBOARD_READY port=9119"). That caused a permanent
          # crash-loop: readiness failed immediately (connection refused), liveness
          # failed after 3x30s and killed the container, repeat forever (232 restarts).
          readinessProbe:
            httpGet:
              path: /health
              port: 9119
            initialDelaySeconds: 15
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 9119
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: config
          configMap:
            name: hermes-config
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir: {}
        - name: kubectl-bin
          emptyDir: {}
        - name: claude-tools
          emptyDir: {}
        - name: ssh-keys
          emptyDir: {}
        - name: ssh-config
          configMap:
            name: hermes-config
        - name: git-deploy-key
          secret:
            secretName: hermes-secrets
            defaultMode: 0400
            items:
              - key: GIT_DEPLOY_KEY
                path: GIT_DEPLOY_KEY
        - name: fleet-ssh-key
          secret:
            secretName: hermes-secrets
            defaultMode: 0400
            items:
              - key: FLEET_SSH_KEY
                path: FLEET_SSH_KEY
        - name: nixos-deploy-key
          secret:
            secretName: hermes-secrets
            defaultMode: 0400
            items:
              - key: NIXOS_DEPLOY_KEY
                path: NIXOS_DEPLOY_KEY