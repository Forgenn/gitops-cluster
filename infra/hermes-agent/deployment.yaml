apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-agent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      securityContext:
        fsGroup: 10000
      serviceAccountName: hermes-agent
      # This pod uses the default cluster DNS (kube-system's CoreDNS), which never
      # learned .home -- that's a separate CoreDNS instance from the one serving the
      # LAN (infra/coredns). Not changing dnsPolicy since that'd risk breaking this
      # pod's own in-cluster service-name resolution; pinning statically instead,
      # same fix used everywhere else this DNS gap has come up.
      hostAliases:
        - ip: "192.168.1.155"
          hostnames: ["dubois.home"]
        - ip: "192.168.1.156"
          hostnames: ["cuno.home"]
        - ip: "192.168.1.157"
          hostnames: ["katsuragi.home"]
        - ip: "192.168.1.34"
          hostnames: ["dolores.home"]
      # The image doesn't bundle kubectl -- copy the binary in from a real kubectl
      # image rather than baking a custom image just for this one tool. Real semver
      # tags, matches the cluster's own k3s version. Deliberately not bitnami/kubectl
      # (dropped pinned tags for free/community images in 2025) or registry.k8s.io/kubectl
      # (real tags, but a truly shell-less distroless image -- no cp, can't be used for
      # this copy-out pattern at all). alpine/k8s has both: real tags and a full
      # shell/coreutils, verified live before picking it.
      initContainers:
        - name: kubectl-copy
          image: alpine/k8s:1.35.6
          command: ["cp", "/usr/bin/kubectl", "/kubectl-bin/kubectl"]
          volumeMounts:
            - name: kubectl-bin
              mountPath: /kubectl-bin
        # The pod's fsGroup (needed by the app itself) forces group-read onto
        # Secret-mounted files no matter what defaultMode says -- SSH categorically
        # refuses a group-readable private key. Copy the keys into a plain writable
        # emptyDir, chmod AND chown there (the fsGroup floor doesn't apply), so the
        # app user (uid/gid 10000) can actually read them. These land in
        # /opt/data/home/.ssh (the app's literal HOME), NOT /root/.ssh: the gateway
        # runs as uid 10000 with HOME=/opt/data/home, and /root is drwx------ root-only,
        # so a /root mount was never readable by the process doing git -- the durable
        # fix is to serve the identity from the app's real home on the shared PVC.
        - name: ssh-key-perms
          image: alpine/k8s:1.35.6
          command:
            - sh
            - -c
            - |
              # The three keys below are load-bearing for the agent's own git work.
              # `set -e` makes their absence fail this container LOUDLY and
              # immediately -- that is deliberate and must not be relaxed.
              set -e
              cp /secrets/git-deploy-key/GIT_DEPLOY_KEY /ssh-keys/git_deploy_key
              cp /secrets/fleet-ssh-key/FLEET_SSH_KEY /ssh-keys/fleet_ssh_key
              cp /secrets/nixos-deploy-key/NIXOS_DEPLOY_KEY /ssh-keys/nixos_deploy_key
              chown 10000:10000 /ssh-keys/git_deploy_key /ssh-keys/fleet_ssh_key /ssh-keys/nixos_deploy_key
              chmod 600 /ssh-keys/git_deploy_key /ssh-keys/fleet_ssh_key /ssh-keys/nixos_deploy_key
              set +e
              # PLDER_DEPLOY_KEY_READ is OPTIONAL and handled separately on purpose. It
              # only feeds the profile-sync config clone, which is designed to
              # soft-fail. If it were treated like the three above, a missing key
              # would crash-loop this initContainer and, with strategy: Recreate,
              # take the operator's only conversational interface offline -- for a
              # config problem. The volume carries `optional: true` for the same
              # reason (without it kubelet fails MountVolume.SetUp and the pod
              # never leaves ContainerCreating).
              if cp /secrets/plder-deploy-key-read/PLDER_DEPLOY_KEY_READ /ssh-keys/plder_deploy_key_read 2>/dev/null; then
                chown 10000:10000 /ssh-keys/plder_deploy_key_read
                chmod 600 /ssh-keys/plder_deploy_key_read
              else
                echo "[ssh-key-perms] no plder key yet; config sync will soft-fail"
              fi
              # PLDER_DEPLOY_KEY (write) is likewise OPTIONAL: it only feeds the
              # meta bot's future pushes to plder, which are built to soft-fail.
              # Same reasoning as the read key above -- `optional: true` on the
              # volume plus this soft-fail branch keeps a missing/rotated write
              # key from crash-looping this initContainer or, with
              # strategy: Recreate, stalling the whole pod in ContainerCreating.
              if cp /secrets/plder-deploy-key-write/PLDER_DEPLOY_KEY /ssh-keys/plder_deploy_key_write 2>/dev/null; then
                chown 10000:10000 /ssh-keys/plder_deploy_key_write
                chmod 600 /ssh-keys/plder_deploy_key_write
              else
                echo "[ssh-key-perms] no plder WRITE key yet; meta will soft-fail its pushes"
              fi
              exit 0
          volumeMounts:
            - name: git-deploy-key
              mountPath: /secrets/git-deploy-key
              readOnly: true
            - name: fleet-ssh-key
              mountPath: /secrets/fleet-ssh-key
              readOnly: true
            - name: nixos-deploy-key
              mountPath: /secrets/nixos-deploy-key
              readOnly: true
            - name: plder-deploy-key-read
              mountPath: /secrets/plder-deploy-key-read
              readOnly: true
            - name: plder-deploy-key-write
              mountPath: /secrets/plder-deploy-key-write
              readOnly: true
            - name: ssh-keys
              mountPath: /ssh-keys
        # Applies the declarative behaviour config: clones the plder repo at a pinned
        # commit (AGENT_CONFIG_REF) over the shared PVC, same idea as claude-install's
        # "reapply on every boot" pattern below.
        # It is also the ONLY source of the root config.yaml: sync.py installs
        # plder's hermes/root/config.yaml onto the PVC (refusing a bad one and
        # keeping the live file). Nothing mounts a ConfigMap over that path any
        # more -- do not add one back, it would silently mask the synced file.
        # Must run AFTER ssh-key-perms -- it
        # authenticates with the plder_deploy_key_read that container just copied into the
        # shared ssh-keys emptyDir, using the github.com-plder alias from the
        # ssh-config ConfigMap (mirrors the main container's mounts for both).
        # GIT_SSH_COMMAND passes that config explicitly with -F, and it is REQUIRED:
        # OpenSSH resolves ~/.ssh from the passwd database, NEVER from $HOME. For uid
        # 10000 the passwd home is /opt/data, so ssh looks for /opt/data/.ssh/config and
        # silently ignores the file mounted at /opt/data/home/.ssh/config. Verified live
        # 2026-09-13: with only HOME set the first deploy failed "Could not resolve
        # hostname github.com-plder"; with -F the alias resolves to github.com and the
        # read key. HOME is still set, but only for git's own ~/.gitconfig. Clones into
        # /staging (a scratch emptyDir, not the PVC itself) so a bad checkout never
        # touches /opt/data directly; sync.py stages first, then applies. Runs as the
        # app's own uid/gid (10000) like ssh-key-perms' chown target, not root --
        # anything sync.py writes onto the PVC has to stay readable/writable by the
        # gateway afterwards.
        - name: profile-sync
          image: nousresearch/hermes-agent:v2026.8.19
          command: ["/opt/hermes/.venv/bin/python", "/sync/sync.py"]
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HOME
              value: /opt/data/home
            - name: GIT_SSH_COMMAND
              value: "ssh -F /opt/data/home/.ssh/config"
            # /staging is an emptyDir MOUNT POINT owned by root, while this container
            # runs as uid 10000, so git refuses to check out there with "detected dubious
            # ownership" (its CVE-2022-24765 guard). Whitelisting exactly /staging is safe:
            # it is a pod-private emptyDir this container just created, not a shared
            # filesystem. Set via GIT_CONFIG_* env rather than `git config --global`,
            # which would need a writable ~/.gitconfig. Verified live 2026-09-13 on
            # git 2.47.3: without it the second deploy failed at checkout; with it the
            # real sync.py cloned 8ac43fb and applied SOUL.md and the cron job.
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: /staging
            - name: AGENT_CONFIG_REF
              value: "1c1bc36c929e"
            - name: AGENT_IMAGE
              value: "nousresearch/hermes-agent:v2026.8.19"
            - name: PYTHONPATH
              value: /sync
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: staging
              mountPath: /staging
            - name: sync-scripts
              mountPath: /sync
              readOnly: true
            - name: ssh-keys
              mountPath: /opt/data/home/.ssh/plder_deploy_key_read
              subPath: plder_deploy_key_read
              readOnly: true
            - name: ssh-config
              mountPath: /opt/data/home/.ssh/config
              subPath: ssh_config
              readOnly: true
            # sync.py writes each profile home's .env from these files. Cron builds a
            # profile's secret scope WITHOUT hydrating external sources (unlike a
            # gateway turn), so <home>/.env is the only hydration-free channel and a
            # profile without one resolves no credentials at all. Mounted here as well
            # as on the main container: this initContainer is what writes the files.
            - name: profile-secrets
              mountPath: /etc/hermes-profile-secrets
              readOnly: true
        # Install Claude Code into a writable emptyDir at boot (same pattern as the
        # kubectl-copy initContainer above). The pod image is frozen and not customised,
        # so a tool that isn't in the image is injected this way -- emptyDir is
        # re-populated on every pod start, so `claude` is always present and needs no
        # manual in-pod npm install after a restart. Mounted into the main container
        # at /opt/tools and prepended to PATH (see env below). Node already ships in the
        # base image, so the claude node CLI runs as-is. Files are chowned to the app
        # user (uid/gid 10000) so the gateway can execute them.
        #
        # MUST be a GLIBC node image (trixie-slim), NOT alpine/musl. claude-code's
        # postinstall builds a native binary matched to the install platform: installed
        # on alpine it produces a musl-linked claude.exe (interpreter
        # /lib/ld-musl-x86_64.so.1) that the hermes main container (Debian/glibc)
        # cannot exec -- "cannot execute: required file not found". Built on glibc, the
        # resulting binary runs on the Debian pod.
        - name: claude-install
          image: node:24.20.0-trixie-slim
          command:
            - sh
            - -c
            - |
              export PATH=/usr/local/bin:/usr/bin:/bin
              mkdir -p /opt/tools
              # Retry and LOG. This was `>/dev/null 2>&1 || true`, which hid a silent
              # failure: on 2026-09-19 the pod started while cluster DNS was down, npm
              # could not resolve the registry, and the container exited 0 with an empty
              # /opt/tools -- so `claude` was missing from the agent with nothing logged.
              # Claude models are reachable ONLY through this CLI (CLAUDE_CODE_OAUTH_TOKEN
              # 401s against the Anthropic API), so a missing binary silently removes that
              # capability. Still never fails the pod: exit 0 on every path.
              ok=0
              for attempt in 1 2 3; do
                if npm install -g --prefix /opt/tools @anthropic-ai/claude-code 2>&1; then
                  ok=1; break
                fi
                echo "[claude-install] attempt $attempt failed; retrying in 10s"
                sleep 10
              done
              chown -R 10000:10000 /opt/tools/lib /opt/tools/bin 2>/dev/null || true
              chmod -R a+rX /opt/tools 2>/dev/null || true
              if [ "$ok" = "1" ] && [ -x /opt/tools/bin/claude ]; then
                echo "[claude-install] OK: $(/opt/tools/bin/claude --version 2>&1 | head -1)"
              else
                echo "[claude-install] WARNING: claude CLI NOT installed -- bots cannot call claude -p until a later restart succeeds"
              fi
              exit 0
          volumeMounts:
            - name: claude-tools
              mountPath: /opt/tools
      containers:
        - name: hermes-agent
          image: nousresearch/hermes-agent:v2026.8.19
          args: ["gateway", "run"]
          ports:
            - name: dashboard
              containerPort: 9119
              protocol: TCP
            - name: api
              containerPort: 8642
              protocol: TCP
          env:
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_BASIC_AUTH_ENABLED
              value: "true"
            - name: HERMES_UID
              value: "10000"
            - name: HERMES_GID
              value: "10000"
            # Claude Code is installed by the claude-install initContainer into an
            # emptyDir at /opt/tools (pinned node npm prefix install). Prepend it to
            # PATH so the gateway and any spawned shells can call `claude` directly.
            - name: PATH
              value: "/opt/tools/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games"
            # Explicit allowlist, NOT envFrom: the four SSH deploy keys used to reach
            # this container's process environ via envFrom even though every
            # consumer (ssh_config's IdentityFile lines) reads them as FILES, never
            # as env vars -- envFrom was pure redundant exposure. /proc/<pid>/environ
            # is readable by any uid-10000 process, i.e. by any terminal-capable
            # bot's subprocess regardless of which profile's scope it runs under
            # (docs/plans/2026-09-15-hermes-developer-meta-docs.md Task 1). Keep this
            # list to exactly what is proven needed as a raw env var; the ssh-keys
            # volumes below remain the only channel for GIT_DEPLOY_KEY,
            # NIXOS_DEPLOY_KEY, FLEET_SSH_KEY and PLDER_DEPLOY_KEY_READ.
            # DEVELOPER_GITHUB_PAT and PLDER_DEPLOY_KEY (write) must NEVER be added
            # here -- they travel through the narrower channels in Tasks 3-6.
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef: {name: hermes-secrets, key: OPENROUTER_API_KEY}
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef: {name: hermes-secrets, key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef: {name: hermes-secrets, key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
            - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
              valueFrom:
                secretKeyRef: {name: hermes-secrets, key: HERMES_DASHBOARD_BASIC_AUTH_SECRET}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef: {name: hermes-secrets, key: TELEGRAM_BOT_TOKEN}
            - name: TELEGRAM_ALLOWED_USERS
              valueFrom:
                secretKeyRef: {name: hermes-secrets, key: TELEGRAM_ALLOWED_USERS}
            - name: TELEGRAM_HOME_CHANNEL
              valueFrom:
                secretKeyRef: {name: hermes-secrets, key: TELEGRAM_HOME_CHANNEL}
            - name: TELEGRAM_CRON_THREAD_ID
              valueFrom:
                secretKeyRef: {name: hermes-secrets, key: TELEGRAM_CRON_THREAD_ID}
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef: {name: hermes-secrets, key: CLAUDE_CODE_OAUTH_TOKEN}
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
            - name: kubectl-bin
              mountPath: /usr/local/bin/kubectl
              subPath: kubectl
              readOnly: true
            # Claude Code install (populated by the claude-install initContainer).
            - name: claude-tools
              mountPath: /opt/tools
            # SSH identity for git: served from the app user's real HOME
            # (/opt/data/home, which the gateway runs under as uid 10000). The
            # ssh_config content and key files are written/mounted fresh here rather
            # than into /root/.ssh (root-only, unreadable by uid 10000 -- where this
            # used to point, which is why git "kept breaking" every restart).
            - name: ssh-config
              mountPath: /opt/data/home/.ssh/config
              subPath: ssh_config
              readOnly: true
            - name: ssh-keys
              mountPath: /opt/data/home/.ssh/git_deploy_key
              subPath: git_deploy_key
              readOnly: true
            - name: ssh-keys
              mountPath: /opt/data/home/.ssh/fleet_ssh_key
              subPath: fleet_ssh_key
              readOnly: true
            # nixos-config uses its own per-repo deploy key (already copied into the
            # same ssh-keys emptyDir by the initContainer above) -- mount it too so
            # pushes to that repo work. Previously it was never mounted at all.
            - name: ssh-keys
              mountPath: /opt/data/home/.ssh/nixos_deploy_key
              subPath: nixos_deploy_key
              readOnly: true
            # meta's WRITE key for plder (github.com-plder-write alias only --
            # never the read-only github.com-plder alias used by profile-sync's
            # clone). Not in the explicit env: list above and never will be
            # (Task 1, Ruling 1): the only channel is this file plus the
            # ssh_config alias, so a leaked env dump can't expose it.
            - name: ssh-keys
              mountPath: /opt/data/home/.ssh/plder_deploy_key_write
              subPath: plder_deploy_key_write
              readOnly: true
            # LLM credentials as FILES, for the gateway's multiplexed profiles. See
            # the profile-secrets volume below for why envFrom alone is not enough.
            - name: profile-secrets
              mountPath: /etc/hermes-profile-secrets
              readOnly: true
            # Developer bot's fine-grained PAT, on its OWN mount so ONLY developer's
            # extended secrets.command reads it -- the shared /etc/hermes-profile-secrets
            # directory is read by every profile's identical helper script, so a new
            # credential there would leak into every profile's resolved secret scope.
            # optional: true -- the operator may not have created this secret yet
            # (Task 4's PAT-absence tolerance); the pod must never fail to start over it.
            - name: profile-secrets-developer
              mountPath: /etc/hermes-profile-secrets-developer
              readOnly: true
            # Pre-push guard: pushes to gitops-cluster main touching infra/hermes-agent/
            # are refused and must go through a hermes/<topic> branch the operator merges.
            # Hermes approvals cannot express this (a plain git push is never flagged).
            - name: githooks
              mountPath: /etc/hermes-githooks
              readOnly: true
            - name: githooks-gitconfig
              mountPath: /etc/gitconfig
              subPath: gitconfig
              readOnly: true
          # Sized 2026-09-14 for six served bots (docs/plans/2026-09-14-hermes-bot-roster.md,
          # Task 1): 30-day peak 1176Mi with two profiles; bursts are processes (a
          # `hermes -p` hand-off CLI ~250Mi, Claude Code, execute_code). Stop adding
          # bots if the 1h max working set passes 2.25Gi.
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
          # Probes were pointed at port 8642 ("api"), but nothing actually binds there --
          # only the dashboard (9119) is confirmed live in the container's own startup
          # log ("HERMES_DASHBOARD_READY port=9119"). That caused a permanent
          # crash-loop: readiness failed immediately (connection refused), liveness
          # failed after 3x30s and killed the container, repeat forever (232 restarts).
          readinessProbe:
            httpGet:
              path: /health
              port: 9119
            initialDelaySeconds: 15
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 9119
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir: {}
        - name: kubectl-bin
          emptyDir: {}
        - name: claude-tools
          emptyDir: {}
        # Scratch clone target for profile-sync -- sync.py clones plder here before
        # applying it onto the data PVC, so a bad checkout never lands directly on
        # /opt/data. Reset on every pod start like the other emptyDirs above.
        - name: staging
          emptyDir: {}
        # Scripts run by profile-sync (see initContainers above), sourced from the
        # configMapGenerator so the pod rolls when sync.py or cron_upsert.py change.
        - name: sync-scripts
          configMap:
            name: hermes-sync-scripts
            defaultMode: 0555
        - name: ssh-keys
          emptyDir: {}
        - name: ssh-config
          configMap:
            name: hermes-config
        - name: git-deploy-key
          secret:
            secretName: hermes-secrets
            defaultMode: 0400
            items:
              - key: GIT_DEPLOY_KEY
                path: GIT_DEPLOY_KEY
        - name: fleet-ssh-key
          secret:
            secretName: hermes-secrets
            defaultMode: 0400
            items:
              - key: FLEET_SSH_KEY
                path: FLEET_SSH_KEY
        - name: nixos-deploy-key
          secret:
            secretName: hermes-secrets
            defaultMode: 0400
            items:
              - key: NIXOS_DEPLOY_KEY
                path: NIXOS_DEPLOY_KEY
        # Credentials for agent turns under gateway multiplex. With
        # gateway.multiplex_profiles on, each profile's secret scope is
        # AUTHORITATIVE: get_secret does not fall back to os.environ, so the
        # envFrom above is invisible to every served profile (root included) and
        # every LLM turn fails "No LLM provider configured". Credentials reach the
        # profiles through the `secrets.command` helper in each profile's
        # config.yaml, which reads THESE files. The helper runs with the profile's
        # private environment, not the pod env -- an env-reading helper was tested
        # live 2026-09-13 and produced an empty value -- so files are the only
        # channel. 0440 plus the pod's fsGroup: 10000 makes them readable by the
        # gateway (uid/gid 10000).
        #
        # Deliberately NOT mounted: TELEGRAM_BOT_TOKEN and the other Telegram keys
        # (delivery already works under multiplex, and a bot token in the monitor's
        # scope could make it try to claim its own Telegram adapter), and any SSH
        # key (multi-line, and not needed by agent turns).
        #
        # `optional: true` for the same reason as plder-deploy-key-read below: a
        # key dropped from hermes-secrets must cost agent turns, not the pod.
        - name: profile-secrets
          secret:
            secretName: hermes-secrets
            optional: true
            defaultMode: 0440
            items:
              - key: OPENROUTER_API_KEY
                path: OPENROUTER_API_KEY
              - key: CLAUDE_CODE_OAUTH_TOKEN
                path: CLAUDE_CODE_OAUTH_TOKEN
        # Developer bot's fine-grained PAT. Deliberately its OWN Secret/volume,
        # not a new item under profile-secrets above: that directory is read by
        # every profile's identical secrets.command helper, so a credential
        # placed there would leak into every profile's resolved scope, not just
        # developer's. Backed by its own ExternalSecret (secrets/externalsecret-
        # developer.yaml) so a missing Infisical path never blocks the main
        # hermes-secrets refresh (Task 3, Ruling 4). `optional: true` for the
        # same reason as plder-deploy-key-read below: this Secret may not exist
        # yet (the operator has not created the Infisical path), and the pod
        # must start healthy either way.
        - name: profile-secrets-developer
          secret:
            secretName: hermes-secrets-developer
            optional: true
            defaultMode: 0440
            items:
              - key: DEVELOPER_GITHUB_PAT
                path: DEVELOPER_GITHUB_PAT
        # `optional: true` is REQUIRED here, unlike the three keys above. With an
        # `items:` selector and no `optional`, kubelet refuses to mount the volume
        # at all when the key is missing from hermes-secrets -- MountVolume.SetUp
        # fails and the pod sits in ContainerCreating forever. Combined with
        # strategy: Recreate (the healthy pod is already gone) that is a total
        # outage of the agent, caused by a config-only credential. The sync is
        # built to degrade quietly instead: no key -> clone soft-fails -> last-good
        # or untouched config -> the gateway still starts.
        - name: plder-deploy-key-read
          secret:
            secretName: hermes-secrets
            defaultMode: 0400
            optional: true
            items:
              - key: PLDER_DEPLOY_KEY_READ
                path: PLDER_DEPLOY_KEY_READ
        # meta's plder WRITE key, sourced from its own ExternalSecret/Secret
        # (hermes-secrets-meta) rather than hermes-secrets -- an absent or
        # rotated key here must only cost the meta bot's pushes, never
        # hermes-secrets' refresh for everything else. `optional: true` for the
        # same reason as plder-deploy-key-read above: without it kubelet fails
        # MountVolume.SetUp when the key is missing and, with
        # strategy: Recreate, that is a total outage over a config-only credential.
        - name: plder-deploy-key-write
          secret:
            secretName: hermes-secrets-meta
            optional: true
            defaultMode: 0400
            items:
              - key: PLDER_DEPLOY_KEY
                path: PLDER_DEPLOY_KEY
        - name: githooks
          configMap:
            name: hermes-githooks
            defaultMode: 0555
            items:
              - key: pre-push
                path: pre-push
              # Backs the gitconfig's credential.https://github.com.helper entry
              # (mounted below at /etc/gitconfig) -- must be projected here too or
              # git would look for a helper binary that was never actually mounted.
              - key: git-credential-developer-pat
                path: git-credential-developer-pat
        - name: githooks-gitconfig
          configMap:
            name: hermes-githooks
            items:
              - key: gitconfig
                path: gitconfig