# Continuous replication of every Hermes SQLite database
# (gitops docs/plans/2026-09-28-hermes-hardening.md, Task 7).
# 34 *.db files as of 2026-09-28: root + per-profile state.db (conversation history),
# kanban, projects, cron executions, response store. `watch` picks up new profiles.
# Hermes checkpoints with PASSIVE in normal operation. A TRUNCATE only follows a
# manual `hermes sessions vacuum`, which makes Litestream start a new generation
# (a full snapshot); that is expected, not an error.
# 7 days of point-in-time history: long enough to rewind a poisoned or vandalised
# database found days later.
snapshot:
  interval: 24h
  retention: 168h
dbs:
  - dir: /opt/data
    pattern: "*.db"
    recursive: true
    watch: true
    # Keep Litestream's own bookkeeping out of the profile homes that sync.py manages.
    meta-dir: /opt/data/.litestream
    replica:
      type: s3
      bucket: revachol
      path: litestream/hermes-agent
      endpoint: https://hel1.your-objectstorage.com
      region: hel1
      force-path-style: true
