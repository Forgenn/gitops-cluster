apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-litestream
  namespace: hermes
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: hermes-litestream
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Same Hetzner bucket credentials as hermes-bucket-restic-config (Pol declined a
    # separate scoped project, 2026-09-30). Mounted ONLY in the litestream sidecar,
    # whose environment the hermes-agent container cannot read.
    - secretKey: LITESTREAM_ACCESS_KEY_ID
      remoteRef:
        key: /hetzner/revachol-bucket/ACCESS_KEY
    - secretKey: LITESTREAM_SECRET_ACCESS_KEY
      remoteRef:
        key: /hetzner/revachol-bucket/ACCESS_SECRET_KEY
  refreshInterval: 1h
