# Executor self-host: API + MCP endpoint (/mcp) + auth + app runtime + dashboard
# in ONE container over an embedded PGlite database (docs: executor.sh/docs/run/self-host).
# Image digest pinned for linux/amd64 (2.0.0-beta.27).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: executor
  labels:
    app.kubernetes.io/name: executor
spec:
  serviceName: executor
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: executor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: executor
    spec:
      containers:
        - name: executor
          image: ghcr.io/usefulsoftwareco/executor-selfhost:2.0.0-beta.27@sha256:5e0b407b5a9dac8f60672716930ed6896a7bc8da4afa2fc24715af9aec05b668
          ports:
            - name: http
              containerPort: 4400
          env:
            # Public origin: browser sign-in happens here. Internal name only
            # (LAN + Tailscale via the gateway SecurityPolicy) - no public exposure.
            - name: BETTER_AUTH_URL
              value: https://executor.monederobox.dev
            # Homelab privacy default: no anonymous usage analytics. Flip in git
            # if Pol wants them back.
            - name: EXECUTOR_DISABLE_ANALYTICS
              value: "1"
            # EXECUTOR_APPS_ALLOW_PRIVATE_FETCH intentionally UNSET (default false):
            # app code must not reach private cluster addresses.
          envFrom:
            - secretRef:
                name: executor-env
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: executor-data
              mountPath: /app/data
  volumeClaimTemplates:
    - metadata:
        name: executor-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: executor
  labels:
    app.kubernetes.io/name: executor
spec:
  selector:
    app.kubernetes.io/name: executor
  ports:
    - name: http
      port: 80
      targetPort: http
