# NetworkPolicies - ingress only, mirrors infra/zot/network-policies.yaml.
# Egress is left open: Executor needs outbound to public services (npm registry for
# app builds, api.executor.sh catalog, OAuth flows to e.g. GitHub).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: executor-default-deny-ingress
  namespace: executor
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: executor-allow-from-envoy-gateway
  namespace: executor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: executor
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: executor-allow-intra-namespace
  namespace: executor
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
