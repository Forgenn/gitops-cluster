# Executor self-host (single container: API + MCP + auth + dashboard over PGlite).
# Secrets come from Infisical via the cluster-wide External Secrets flow:
#   /executor/BETTER_AUTH_SECRET  - random, >= 32 chars (session signing)
#   /executor/ENCRYPTION_KEY      - random, EXACTLY 64 hex chars (credential encryption)
# Until both keys exist in Infisical this ExternalSecret stays NotReady, the
# secret is absent, and the pod fails container creation loudly by design
# (upstream also refuses to boot an existing DB with a missing/rotated key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: executor-env
  namespace: executor
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: executor-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: /executor/BETTER_AUTH_SECRET
    - secretKey: EXECUTOR_ENCRYPTION_KEY
      remoteRef:
        key: /executor/ENCRYPTION_KEY
  refreshInterval: 1h
