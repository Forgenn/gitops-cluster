apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sparky-fitness-cnpg-cluster
  namespace: sparky-fitness
spec:
  # Was 1 -- PDB showed ALLOWED DISRUPTIONS: 0, any node drain hosting this blocks
  # until forced. Small DB (5Gi) so HA cost is negligible. Found via the Opus 5 audit.
  instances: 3
  # Requests keep this out of BestEffort QoS (first to be OOM-killed under node
  # pressure) -- sized off actual usage (~6m CPU, ~77Mi RSS observed). Limits leave
  # headroom for backup/vacuum spikes. Found via the Opus 5 audit.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  storage:
    storageClass: zfs-generic-nfs-csi
    size: 5Gi
  bootstrap:
    initdb:
      database: sparkyfitness
      owner: sparkyfitness
      postInitSQL:
        - "ALTER USER sparkyfitness SUPERUSER;"

  # Ongoing backups -- this cluster had no backup config at all (found via audit:
  # no spec.backup, no firstRecoverabilityPoint, no ScheduledBackup). Same
  # hetzner-backup-bucket-credentials pattern used by every other CNPG cluster here.
  backup:
    barmanObjectStore:
      endpointURL: "https://hel1.your-objectstorage.com"
      destinationPath: "s3://revachol/backups/sparky-fitness-cnpg-db"
      s3Credentials:
        accessKeyId:
          name: hetzner-backup-bucket-credentials
          key: ACCESS_KEY
        secretAccessKey:
          name: hetzner-backup-bucket-credentials
          key: ACCESS_SECRET_KEY
      data:
        compression: gzip
    retentionPolicy: 60d
