apiVersion: v1
kind: ConfigMap
metadata:
  name: tuwunel-config
  namespace: tuwunel
data:
  tuwunel.toml: |
    [global]
    # Permanent: user IDs are @name:matrix.monederobox.dev (confirmed by Pol 2026-10-02).
    server_name = "matrix.monederobox.dev"
    database_path = "/var/lib/tuwunel"
    address = ["0.0.0.0"]
    port = 8008
    allow_federation = false
    trusted_servers = []
    # Closed after Pol registered @ntb (2026-10-02). Appservice users (hrld bots) are
    # registered by the appservice and are not affected. To add an account: set true for the
    # registration, then back to false.
    allow_registration = false
    registration_token_file = "/secrets/registration/token"
    # Tuwunel appends a heart emoji to new display names by default.
    new_user_displayname_suffix = ""
    # Element X logs in through Tuwunel's own OIDC page (no MAS).
    oidc_native_auth = true
    # The hrld appservice registration, rendered by ESO from Infisical (tokens never in git).
    appservice_dir = "/etc/tuwunel/appservices"

    [global.well_known]
    client = "https://matrix.monederobox.dev"
