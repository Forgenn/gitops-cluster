apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: tuwunel-data
spec:
  sourcePVC: tuwunel-data
  trigger:
    schedule: "20 2 * * *"
  restic:
    # A snapshot clone, not the live RocksDB files.
    copyMethod: Snapshot
    storageClassName: longhorn
    volumeSnapshotClassName: longhorn
    pruneIntervalDays: 14
    cacheCapacity: 1Gi
    repository: tuwunel-restic-config
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    retain:
      daily: 7
      weekly: 5
      monthly: 6
      within: 3d
