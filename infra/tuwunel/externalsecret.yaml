apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuwunel-registration
  namespace: tuwunel
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: tuwunel-registration
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: /tuwunel/REGISTRATION_TOKEN
  refreshInterval: 1h
---
# The hrld application-service registration (Matrix appservice API). Its tokens live in
# Infisical /hrld; ESO renders the YAML file Tuwunel loads from appservice_dir.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuwunel-appservice
  namespace: tuwunel
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: tuwunel-appservice
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        hrld.yaml: |
          id: hrld
          url: http://hrld.hrld.svc.cluster.local:9000
          as_token: "{{ .as_token }}"
          hs_token: "{{ .hs_token }}"
          sender_localpart: hrld
          rate_limited: false
          # E2EE for hrld bots (no /sync loop): to-device + device lists + key counts in transactions
          # (MSC2409/MSC4203, MSC3202), and appservice-managed devices (MSC4190).
          receive_ephemeral: true
          org.matrix.msc3202: true
          device_management: true
          io.element.msc4190: true
          namespaces:
            users:
              - exclusive: true
                regex: '^@hrld_.*:matrix\.monederobox\.dev$'
  data:
    - secretKey: as_token
      remoteRef:
        key: /hrld/AS_TOKEN
    - secretKey: hs_token
      remoteRef:
        key: /hrld/HS_TOKEN
  refreshInterval: 1h
