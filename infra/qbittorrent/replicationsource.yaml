apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: qbittorrent-config
spec:
  sourcePVC: qbittorrent-config
  trigger:
    schedule: "0 2 * * *"
  restic:
    copyMethod: Direct
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    pruneIntervalDays: 7
    cacheCapacity: 5Gi
    repository: qbittorrent-config-restic-config
    retain:
      daily: 7
      within: 3d
