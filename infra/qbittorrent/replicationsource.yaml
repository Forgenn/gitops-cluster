apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: qbittorrent-config
spec:
  sourcePVC: qbittorrent-config
  trigger:
    schedule: "0 2 * * *"
  restic:
    copyMethod: Direct
    # The mover has to run as this app's uid, not root. /config/qBittorrent/logs/
    # qbittorrent.log stopped being readable by a root mover (uid 0, gid 1000,
    # capabilities dropped -> no DAC_OVERRIDE) on 2026-09-19: restic fails with
    # "open qBittorrent/logs/qbittorrent.log: permission denied", exit code 3, which
    # fails the whole Job, and VolSync retries every ~30s (1400+ snapshots in the
    # repo). Everything else in this volume is uid/gid 1000, and the log file has
    # never been captured since, so running as 1000/1000 reads it as the owner.
    # Same shape as navidrome/backup.yaml, which works with a Longhorn cache PVC.
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
    pruneIntervalDays: 7
    cacheCapacity: 5Gi
    repository: qbittorrent-config-restic-config
    # Bumped to unlock-3 (2026-09-22): the previous run as the app uid (runAsUser
    # 1000) finally read qbittorrent.log and saved its snapshot, but then died at
    # `forget` on a lock left by a root mover on 2026-09-21T01:42Z. unlock-2 was
    # already consumed (status.restic.lastUnlocked), so no further unlock ran.
    # VolSync runs `restic unlock` before the backup only when this string changes.
    unlock: unlock-3
    retain:
      daily: 7
      within: 3d
