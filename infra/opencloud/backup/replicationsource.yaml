apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: opencloud-data-backup
  namespace: opencloud
spec:
  sourcePVC: opencloud-opencloud-posixfs
  # Paused 2026-11-28 10:14Z-~10:50Z to break a self-perpetuating stale-lock loop.
  # If a mover keeps dying at `forget` with "repository is already locked" again,
  # this is the remedy (bumping restic.unlock alone is not enough):
  #
  # every mover pod runs `restic unlock` at start, but restic only removes a lock
  # from ANOTHER host (another pod) once it is older than 30 minutes, and `forget`
  # refuses on any lock that remains. A run here takes 20-29 minutes (390 GiB
  # scan) and a failed attempt is retried within minutes, so a dead predecessor's
  # lock is always too young to clear -> every pod fails at `forget` and the loop
  # never ends. Each lap also rescans 390 GiB on a Longhorn volume and saves a
  # snapshot. Set paused: true for >30 minutes so every lock ages out, then back
  # to false; the next run's unlock clears them and the sync completes.
  paused: false
  trigger:
    schedule: "0 8 * * *"
  restic:
    copyMethod: Snapshot
    pruneIntervalDays: 7
    # Bumped to unlock-2 (2026-11-28): stale lock left by mover
    # volsync-src-opencloud-data-backup-shzmd (PID 41, root) at 08:15:27Z during
    # the post-power-event Longhorn churn; the holder pod is gone, every retry
    # since fails at `forget` with `repo already locked`. unlock was consumed
    # once already (status.restic.lastUnlocked), so this needs a new value.
    unlock: unlock-2
    repository: restic-config
    storageClassName: zfs-generic-nfs-csi
    volumeSnapshotClassName: zfs-generic-nfs-csi
    cacheCapacity: 20Gi
    retain:
      daily: 7
      weekly: 4
      monthly: 6
      yearly: 1
