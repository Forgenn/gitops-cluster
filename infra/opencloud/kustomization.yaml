apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opencloud

resources:
  - httproute.yaml
  #- backup
  - s3-secret.yaml

helmGlobals:
  chartHome: charts
helmCharts:
  - name: opencloud
    valuesFile: values/values.yaml
    releaseName: opencloud
    namespace: opencloud

patches:
  # Waiting on https://github.com/opencloud-eu/desktop/issues/217
  # for - name: PROXY_ROLE_ASSIGNMENT_DRIVER
  #                 value: "oidc"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: opencloud-opencloud
      spec:
        template:
          spec:
            containers:
              - name: opencloud
                env:
                  - name: PROXY_OIDC_REWRITE_WELLKNOWN
                    value: "true"
                  - name: PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM
                    value: "groups"
                  - name: WEB_OIDC_SCOPE
                    value: "openid profile email groups"
                  - name: PROXY_ROLE_ASSIGNMENT_DRIVER
                    value: "default"
                  - name: PROXY_AUTOPROVISION_ACCOUNTS
                    value: "true"
                  - name: STORAGE_USERS_POSIX_WATCH_FS
                    value: "true"
  # We have to set the local DNS server, as its trying to resolve the pocket-id instance
  # without our local dns server, it is not public.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: opencloud-opencloud
      spec:
        template:
          spec:
            dnsPolicy: "None"
            dnsConfig:
              nameservers:
                - "10.43.230.214"
              searches:
                - opencloud.svc.cluster.local
                - svc.cluster.local
                - cluster.local
  # opencloud's dnsPolicy: None above points it ONLY at the custom coredns instance (for
  # split-horizon .monederobox.dev resolution). That resolver has no `kubernetes` plugin
  # and forwards everything else to public DNS -- meaning in-cluster service names like
  # opencloud-tika return NXDOMAIN 100% of the time (confirmed live via direct nslookup,
  # not a timing race). opencloud's own supervisor (thejerf/suture) panics instead of
  # degrading once search exhausts its retry budget against a name that can genuinely
  # never resolve. The real fix is in infra/coredns (forward cluster.local to the real
  # cluster CoreDNS) -- see that commit.
