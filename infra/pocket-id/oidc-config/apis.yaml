# Pocket ID API resources (RFC 8707), declared here because Pocket ID keeps them in its database.
# Applied by scripts/pocket-id-apply.py (idempotent): it creates missing APIs, sets their permissions,
# and sets each listed client's grant. It never deletes an API or a grant that is not listed here.
# Not a Kubernetes resource: kustomize does not read this folder.
#
# A client asks for a token with `resource=<resource>`; the token's `aud` is then the resource and
# its scopes the granted permissions, so the API can reject tokens minted for anything else.
apis:
  - name: hrld
    # Identifier only (stamped into `aud`); it never changes, or every issued token breaks.
    resource: https://hrld.monederobox.dev
    permissions:
      - key: "hrld:chat"
        name: Chat with hrld bots
        description: List bots and conversations, send messages, follow events.
    clients:
      # loomie acts for the logged-in user (authorization code), never as itself.
      - name: loomie
        userDelegated: ["hrld:chat"]
        clientCredentials: []
  - name: loomie
    # loomie's MCP server (tools over loomie's data), consumed by hrld bots.
    resource: https://loomie.monederobox.dev/mcp
    permissions:
      - key: "loomie:read"
        name: Read loomie data
        description: Read tools (fitness, nutrition, tasks, schedule, shopping, tea, finance summaries).
      - key: "loomie:write"
        name: Change loomie data
        description: Write tools (log meals and workouts, tasks, schedule, shopping). Finance stays read-only.
    clients:
      # hrld acts as itself (client credentials); bots run without a person signed in.
      - name: hrld
        userDelegated: []
        clientCredentials: ["loomie:read", "loomie:write"]
