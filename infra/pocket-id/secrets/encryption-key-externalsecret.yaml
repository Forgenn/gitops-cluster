# Pocket ID v2 requires ENCRYPTION_KEY: it encrypts the signing keys (now stored in the database).
# Losing it means losing those keys: it lives in Infisical (/pocket-id/ENCRYPTION_KEY), never rotate
# it casually. Merged into pocket-id-secret like the DB and SMTP settings.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-encryption-key
  namespace: pocket-id
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: pocket-id-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: /pocket-id/ENCRYPTION_KEY
  refreshInterval: 1h
