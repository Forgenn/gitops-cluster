apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pocket-id-cnpg-cluster
spec:
  # Was 1 -- pocket-id is the OIDC provider gating login to Grafana, ArgoCD, kavita,
  # lidarr, prowlarr, qbittorrent, readarr, slskd, and zot. PDB showed
  # ALLOWED DISRUPTIONS: 0, any node drain hosting this locked everyone out until
  # forced. Small DB (10Gi) so HA cost is negligible. Found via the Opus 5 audit.
  instances: 3

  # Requests keep this out of BestEffort QoS (first to be OOM-killed under node
  # pressure) -- sized off actual usage (~5m CPU, ~60Mi RSS observed). Limits leave
  # headroom for backup/vacuum spikes. Found via the Opus 5 audit.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  # Bootstrap from backup
  bootstrap:
    recovery:
      source: pocket-id-cnpg-cluster

  # Ongoing backups -- this was missing entirely (only the one-time restore-from-backup
  # config below existed), so the pre-existing ScheduledBackup had nothing to talk to and
  # failed every day since creation. Points at the same destinationPath as externalClusters
  # to continue the existing backup chain rather than starting a fresh one. Found via audit.
  backup:
    barmanObjectStore:
      endpointURL: "https://hel1.your-objectstorage.com"
      destinationPath: "s3://revachol/backups/pocket-id-cnpg-db"
      s3Credentials:
        accessKeyId:
          name: hetzner-backup-bucket-credentials
          key: ACCESS_KEY
        secretAccessKey:
          name: hetzner-backup-bucket-credentials
          key: ACCESS_SECRET_KEY
      data:
        compression: gzip
    retentionPolicy: 60d

  # Reference to the backup configuration
  externalClusters:
    - name: pocket-id-cnpg-cluster
      barmanObjectStore:
        endpointURL: "https://hel1.your-objectstorage.com"
        destinationPath: "s3://revachol/backups/pocket-id-cnpg-db"
        s3Credentials:
          accessKeyId:
            name: hetzner-backup-bucket-credentials
            key: ACCESS_KEY
          secretAccessKey:
            name: hetzner-backup-bucket-credentials
            key: ACCESS_SECRET_KEY
        wal:
          compression: gzip

  storage:
    storageClass: zfs-generic-nfs-csi
    size: 10Gi
