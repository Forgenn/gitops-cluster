apiVersion: apps/v1
kind: Deployment
metadata:
  name: ddns-updater
  labels:
    app: ddns-updater
spec:
  selector:
    matchLabels:
      app: ddns-updater
  template:
    metadata:
      labels:
        app: ddns-updater
    spec:
      containers:
        - name: ddns
          # Pinned to the exact digest already running (verified via `latest` currently
          # resolving to a DIFFERENT digest than what's live -- confirms drift already
          # happened at least once). No semver tag on Docker Hub maps cleanly to this
          # digest, so pinning by digest directly rather than guessing a tag.
          image: qmcgaw/ddns-updater@sha256:dd0d029b8ed74062d53c3a42e147462598600e842b6d08d8cd809b5ab41869e1
          envFrom:
            - secretRef:
                name: porkbun-ddns-credentials
          ports:
            - containerPort: 8000
          # Tried the image's own Dockerfile HEALTHCHECK command as liveness/readiness
          # probes, but reverted: its healthcheck does its own DNS lookup of the
          # configured domain to self-verify, and this cluster's split-horizon CoreDNS
          # wildcard-answers every *.monederobox.dev query with the internal LB IP
          # (see infra/coredns/values/zones.yaml's template plugin) -- so the
          # healthcheck always reports unhealthy regardless of whether the actual DNS
          # update succeeded. A failing liveness probe means restart-loop, which is
          # worse than no probe at all, so left unprobed rather than ship something
          # actively harmful. Found via the Opus 5 audit (QoS only; the probe
          # incompatibility was found and reverted in the same pass).
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi