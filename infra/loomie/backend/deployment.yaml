apiVersion: apps/v1
kind: Deployment
metadata:
  name: loomie-backend
  namespace: loomie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loomie-backend
  template:
    metadata:
      labels:
        app: loomie-backend
    spec:
      serviceAccountName: loomie-backend
      # loomie no longer talks to the Kubernetes API (environments are gone).
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: registry-credentials
      # F2 / P-03: pod-level hardening — non-root, no privilege escalation,
      # restricted seccomp. The image already runs as appuser (uid 1000).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # 23,037 restarts over 74d -- not a runtime bug, the app itself retries the DB
      # 10x with backoff then exits if loomie-db-rw isn't reachable yet, which a
      # brief CNPG primary switchover/restart is enough to trigger. This waits for the
      # DB to accept TCP connections before the main container ever starts, so a
      # transient DB blip no longer kills the pod. The app's own retry behavior is in
      # its own source repo, not this one -- this is the infra-level mitigation.
      # Found via the Opus 5 audit.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 loomie-db-rw 5432; do
                echo "waiting for loomie-db-rw:5432..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: [ALL]
      containers:
        - name: backend
          image: registry.monederobox.dev/loomie/backend:a381e86
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: loomie-db-app
                  key: uri
            - name: CORS_ALLOWED_ORIGINS
              value: "https://loomie.monederobox.dev"
            # OIDC Configuration (Pocket ID)
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_PROVIDER_URL
              value: "https://pocket-id.monederobox.dev"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: loomie-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: loomie-secrets
                  key: OIDC_CLIENT_SECRET
            # The backend finishes sign-in itself (BFF): the browser never sees a token.
            - name: OIDC_REDIRECT_URL
              value: "https://loomie.monederobox.dev/api/v1/auth/oidc/callback"
            # Chat backends (/api/agents), as name=url|resource: each is connected per session
            # with a Pocket ID token for its resource, kept encrypted.
            - name: AGENT_BACKENDS
              value: "hrld=http://hrld.hrld.svc.cluster.local:8080|https://hrld.monederobox.dev"
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: loomie-secrets
                  key: TOKEN_ENCRYPTION_KEY
            # MCP endpoint (/mcp) for hrld bots: Pocket ID client credentials,
            # API resource "loomie" (gitops infra/pocket-id/oidc-config/apis.yaml).
            - name: MCP_ENABLED
              value: "true"
            - name: MCP_RESOURCE
              value: "https://loomie.monederobox.dev/mcp"
            - name: MCP_ALLOWED_CLIENTS
              value: "572bb0e1-4dd4-4082-9a91-3af9fa880deb" # Pocket ID client "hrld"
            - name: MCP_USER_OIDC_SUBJECT
              value: "657b4b32-0264-422e-b505-159488890cc4" # Pocket ID user cfv
            # Push notifications (FCM)
            - name: FCM_SA_KEY
              valueFrom:
                secretKeyRef:
                  name: loomie-secrets
                  key: FCM_SA_KEY
            - name: APP_URL
              value: "https://loomie.monederobox.dev"
            # Strava integration
            - name: STRAVA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: loomie-secrets
                  key: STRAVA_CLIENT_ID
            - name: STRAVA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: loomie-secrets
                  key: STRAVA_CLIENT_SECRET
            - name: STRAVA_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: loomie-secrets
                  key: STRAVA_REDIRECT_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
