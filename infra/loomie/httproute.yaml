apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loomie
  namespace: loomie
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - "loomie.monederobox.dev"
  rules:
    # Agent streams (SSE /events and the /v1/pi WebSocket) proxied to hrld live for
    # minutes. Envoy's default 15 s route timeout cut them constantly (access logs
    # 2026-10-29: 1306 x UT flag at exactly 15000 ms on .../conversations/{id}/events),
    # forcing a reconnect every 15 s — each reconnect landing in an hrld pod
    # replacement window surfaced to the user as "hrld answered 502" (loomie's own
    # proxy returns the body-less 502 when its upstream dial fails). GEP-1742:
    # request timeout 0s disables the per-request timeout for exactly this rule.
    - matches:
        - path:
            type: PathPrefix
            value: /api/agents
      timeouts:
        request: 0s
      backendRefs:
        - group: ""
          kind: Service
          name: loomie-backend
          port: 8080
          weight: 1
    # Other API routes keep the finite default timeout.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - group: ""
          kind: Service
          name: loomie-backend
          port: 8080
          weight: 1
    # All other routes to frontend
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: loomie-frontend
          port: 3000
          weight: 1
---
# SecurityPolicy - VPN/internal access only
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: loomie-internal
  namespace: loomie
spec:
  targetRefs:
    - group: "gateway.networking.k8s.io"
      name: loomie
      kind: HTTPRoute
  authorization:
    defaultAction: Deny
    rules:
      - action: Allow
        principal:
          clientCIDRs:
            - 100.64.0.0/10
            - 192.168.1.0/24
