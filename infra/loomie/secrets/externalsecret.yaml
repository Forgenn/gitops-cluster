apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loomie-secrets
  namespace: loomie
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: loomie-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Agent-backend tokens at rest (AES-256-GCM key)
    - secretKey: TOKEN_ENCRYPTION_KEY
      remoteRef:
        key: /loomie/TOKEN_ENCRYPTION_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # OIDC (Pocket ID)
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: /pocket-id/loomie/client-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: /pocket-id/loomie/client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # FCM push notifications
    - secretKey: FCM_SA_KEY
      remoteRef:
        key: /loomie/FCM_SA_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Alertmanager integration (POST /api/v1/integrations/alertmanager).
    # The SAME value is mounted into Alertmanager (monitoring ns) via
    # infra/monitoring/loomie-webhook-externalsecret.yaml.
    - secretKey: ALERTMANAGER_WEBHOOK_TOKEN
      remoteRef:
        key: /loomie/ALERTMANAGER_WEBHOOK_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Google Health (docs/specs/health-fitness.md in loomie): OAuth client in Pol's Google Cloud project
    - secretKey: GOOGLE_HEALTH_CLIENT_ID
      remoteRef:
        key: /loomie/GOOGLE_HEALTH_CLIENT_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: GOOGLE_HEALTH_CLIENT_SECRET
      remoteRef:
        key: /loomie/GOOGLE_HEALTH_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
  refreshInterval: 1h
