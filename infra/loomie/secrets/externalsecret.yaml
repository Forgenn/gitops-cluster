apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loomie-secrets
  namespace: loomie
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: loomie-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Agent-backend tokens at rest (AES-256-GCM key)
    - secretKey: TOKEN_ENCRYPTION_KEY
      remoteRef:
        key: /loomie/TOKEN_ENCRYPTION_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # OIDC (Pocket ID)
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: /pocket-id/loomie/client-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: /pocket-id/loomie/client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # FCM push notifications
    - secretKey: FCM_SA_KEY
      remoteRef:
        key: /loomie/FCM_SA_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Strava integration
    - secretKey: STRAVA_CLIENT_ID
      remoteRef:
        key: /loomie/STRAVA_CLIENT_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: STRAVA_CLIENT_SECRET
      remoteRef:
        key: /loomie/STRAVA_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: STRAVA_REDIRECT_URL
      remoteRef:
        key: /loomie/STRAVA_REDIRECT_URL
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
  refreshInterval: 1h
