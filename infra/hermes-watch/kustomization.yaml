apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` override: the Role and RoleBinding must live in `hermes`
# (where the pod is); every resource declares its own namespace.

resources:
  - namespace.yaml
  - rbac.yaml
  - externalsecret.yaml
  - cronjob.yaml

configMapGenerator:
  - name: hermes-watch-scripts
    namespace: hermes-watch
    files:
      - check_integrity.py
