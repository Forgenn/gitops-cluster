apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-watch
  namespace: hermes-watch
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: hermes-watch
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Alerts go to Pol's Telegram through the same bot alertmanager uses.
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: /monitoring/telegram/BOT_TOKEN
    - secretKey: TELEGRAM_CHAT_ID
      remoteRef:
        key: /monitoring/telegram/CHAT_ID
    # Read-only plder deploy key: the check clones plder at the pinned ref itself.
    - secretKey: plder_read
      remoteRef:
        key: /hermes/PLDER_DEPLOY_KEY_READ
  refreshInterval: 1h
