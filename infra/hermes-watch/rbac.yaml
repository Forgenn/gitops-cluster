# Out-of-pod integrity checks for Hermes (gitops docs/plans/2026-09-28-hermes-hardening.md Task 13).
# Exec into the Hermes pod and read its Deployment, plus its own alert-dedupe ConfigMap.
# This token never enters the Hermes pod. The check runs only root-owned binaries in
# the pod (check_integrity.py), so a bot can't fake its readings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-watch
  namespace: hermes-watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-watch
  namespace: hermes
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-watch
  namespace: hermes
subjects:
  - {kind: ServiceAccount, name: hermes-watch, namespace: hermes-watch}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-watch
---
# Alert dedupe state (hermes-watch-state). Created by the job, not by ArgoCD: it
# changes with every alert. create cannot be limited by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-watch-state
  namespace: hermes-watch
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [hermes-watch-state]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-watch-state
  namespace: hermes-watch
subjects:
  - {kind: ServiceAccount, name: hermes-watch, namespace: hermes-watch}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-watch-state
