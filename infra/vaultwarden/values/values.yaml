database:
  type: "postgresql"
  existingSecret: "vaultwarden-cnpg-cluster-app"
  existingSecretKey: "uri"

replicas: 1

# replicas=1 on a ReadWriteOnce longhorn volume: the default RollingUpdate
# (maxSurge 25% -> 1, maxUnavailable 25% -> 0) starts a second pod before
# releasing the first, and if it schedules onto another node it blocks forever
# on the volume while the old pod is never torn down. Recreate is what every
# other single-replica RWO app here uses.
strategy:
  type: Recreate

storage:
  data:
    name: "vaultwarden-data"
    size: "5Gi"
    class: "longhorn"
    accessMode: "ReadWriteOnce"

adminToken:
  existingSecret: "vaultwarden-admin"
  existingSecretKey: "ADMIN_TOKEN"
  value: ""

smtp:
  host: smtp.gmail.com
  from: "no-reply@monederobox.dev"
  fromName: "Vaultwarden"
  security: "force_tls"
  port: 465
  existingSecret: "vaultwarden-smtp"
  username:
    existingSecretKey: "SMTP_USER"
  password:
    existingSecretKey: "SMTP_PASSWORD"

# Enable the web vault
webVaultEnabled: "true"

# Set the domain
domain: "https://vault.monederobox.dev"

# Allow signups but require verification
signupsAllowed: false
signupsVerify: true
adminRateLimitSeconds: 15
