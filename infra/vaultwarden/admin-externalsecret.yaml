# Dedicated target for the admin token. The chart also renders its own
# Secret/vaultwarden (YUBICO_SECRET_KEY, DUO_SKEY, PUSH_INSTALLATION_ID,
# PUSH_INSTALLATION_KEY -- all empty strings), so pointing an ExternalSecret at
# that same name makes external-secrets and ArgoCD fight over one object:
# external-secrets owns it and writes only ADMIN_TOKEN, ArgoCD wants the
# chart's 4 keys, neither yields, and the app is OutOfSync forever. Giving the
# token its own Secret lets the chart own Secret/vaultwarden outright.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-admin
  namespace: vaultwarden
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: vaultwarden-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: /vaultwarden/ADMIN_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
  refreshInterval: 1h
