# Helm registry login for the repo-server, so kustomize `helmCharts` can pull private OCI
# charts from zot (e.g. oci://registry.monederobox.dev/hrld/charts). Mounted read-only into
# the repo-server only; HELM_REGISTRY_CONFIG points helm at it (values/values.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: helm-registry-config
  namespace: argocd
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: helm-registry-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        config.json: |
          {"auths": {"registry.monederobox.dev": {"auth": "{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: /zot/REGISTRY_USERNAME
    - secretKey: password
      remoteRef:
        key: /zot/REGISTRY_PASSWORD
  refreshInterval: 1h
