apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - httproute-internal.yaml
  - externalsecret.yaml

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    releaseName: argocd
    version: "8.6.0"
    namespace: argocd
    valuesFile: values/values.yaml
    # ArgoCD must own its own CRDs (Application/ApplicationSet/AppProject). kustomize's
    # helmCharts generator defaults includeCRDs to FALSE, so without this the CRDs are
    # only installed by the k3s helm-controller's bootstrap argo-cd — a second owner that
    # becomes unowned when that bootstrap is removed. Tracked here so the cutover is safe.
    includeCRDs: true
