redis-ha:
  enabled: false

# We terminate TLS at the gateway
configs:
  params:
    server.insecure: true
    # Enable ArgoCD Server-Side Diff (stable since v3.1.0). The default Structured-Merge
    # diff explicitly struggles with CRDs that define defaults / operators that rewrite
    # fields (CNPG Cluster, ESO ExternalSecret), so those apps stay OutOfSync even when
    # Healthy. Server-Side Diff does a dry-run SSA and compares the predicted result, so
    # API-server and CRD-schema defaults never appear as drift. This is the canonical fix
    # for the 5 CNPG/ESO-database apps and makes most of the ignore-list below unnecessary.
    controller.diff.server.side: "true"
  cm:
    url: https://argocd.monederobox.dev
    # kustomize.buildOptions moved here from the (removed) NixOS argocd-cm writer so
    # ArgoCD can inflate helmCharts via kustomize regardless of which owner is active.
    kustomize.buildOptions: --enable-helm
    # Cluster-wide SSA default-field + controller-annotation ignore set.
    # Git never specifies these on Deployments/StatefulSets, yet the API server
    # (SSA) adds them at apply time; ArgoCD flags them as OutOfSync forever even
    # though desired==live. This makes the 5 chronically-OutOfSync apps
    # (infisical, pocket-id, sparky-fitness, vaultwarden, hermes-agent) reconcile
    # to Synced. Covers: imagePullPolicy, probe threshold defaults, DNS/restart/
    # scheduler policy, rollingUpdate strategy, revisionHistoryLimit, PV retention
    # policy (STS), plus controller-managed annotations (updatedAt, restartedAt,
    # deployment revision, helm checksum). This is the same drift the nixos-bootstrap
    # argocd-cm tried to patch but gets overwritten by this chart on every sync.
    resource.customizations.ignoreDifferences.apps_Deployment: |
      jsonPointers:
      - /metadata/annotations/updatedAt
      - /metadata/annotations/deployment.kubernetes.io~1revision
      - /metadata/annotations/kubectl.kubernetes.io~1restartedAt
      - /spec/strategy/rollingUpdate
      - /spec/progressDeadlineSeconds
      - /spec/revisionHistoryLimit
      - /spec/template/metadata/annotations/updatedAt
      - /spec/template/metadata/annotations/deployment.kubernetes.io~1revision
      - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
      - /spec/template/spec/dnsPolicy
      - /spec/template/spec/restartPolicy
      - /spec/template/spec/schedulerName
      - /spec/template/spec/terminationGracePeriodSeconds
    resource.customizations.ignoreDifferences.apps_StatefulSet: |
      jsonPointers:
      - /metadata/annotations/updatedAt
      - /metadata/annotations/deployment.kubernetes.io~1revision
      - /spec/revisionHistoryLimit
      - /spec/template/metadata/annotations/updatedAt
      - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
      - /spec/template/spec/dnsPolicy
      - /spec/template/spec/restartPolicy
      - /spec/template/spec/schedulerName
      - /spec/template/spec/terminationGracePeriodSeconds
    # Operator-managed resources (CNPG Cluster / ExternalSecret / Secret): the
    # controller continuously rewrites `status` (and controller annotations), so
    # ArgoCD's SSA apply succeeds but the CR flips OutOfSync on the next reconcile.
    # This is the loop that keeps the 5 DB-backed apps (infisical, pocket-id,
    # sparky-fitness, vaultwarden, hermes-agent) perpetually OutOfSync despite being
    # Healthy. Ignore ONLY operator-owned status + annotations -- NOT spec/data --
    # so real config drift still surfaces.
    resource.customizations.ignoreDifferences.postgresql.cnpg.io_Cluster: |
      jqPathExpressions:
      - '.status'
      - '.metadata.annotations'
    resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: |
      jqPathExpressions:
      - '.status'
      - '.metadata.annotations'
    resource.customizations.ignoreDifferences._Secret: |
      jqPathExpressions:
      - '.status'
      - '.metadata.annotations'
    oidc.config: |
      name: PocketID
      issuer: https://pocket-id.monederobox.dev
      clientID: $argocd-secret:oidc.clientId
      clientSecret: $argocd-secret:oidc.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
  rbac:
    policy.csv: |
      g, ArgoCDAdmins, role:admin

controller:
  replicas: 1
  metrics:
    enabled: true

server:
  replicas: 1

repoServer:
  replicas: 1

applicationSet:
  replicas: 1
