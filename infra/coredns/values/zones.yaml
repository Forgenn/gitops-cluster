servers:
  - zones:
    port: 53
    plugins:
      # --- Core utility plugins first ---
      - name: errors
      - name: health
        configBlock: |-
          lameduck 10s
      - name: ready
      - name: log

      # Handle  custom zones before checking for anything else.
      - name: template
        parameters: IN A monederobox.dev
        configBlock: |
          match ^([a-z0-9-]+)\.monederobox\.dev\.$
          answer "{{ .Name }} 60 IN A 192.168.1.200"

      # Static .home records — this used to be served by a Docker `bind` container
      # on dolores, backed by the /storage/hydrogen disk. That was an undocumented,
      # unmonitored single point of failure for the whole LAN's .home resolution
      # (root cause of the original dolores.home ENOTFOUND crash-loop too — see the
      # migration report). Moving it here makes it GitOps-managed instead.
      - name: hosts
        parameters: home
        configBlock: |
          192.168.1.34  dolores.home
          192.168.1.155 dubois.home
          192.168.1.156 cuno.home
          192.168.1.157 katsuragi.home
          # k3s API server — HA conversion landed, all 3 nodes now run the server role
          # and are real etcd members. 3-way record; the `loadbalance` plugin below
          # already shuffles multi-A responses, so this gets round-robin for free.
          192.168.1.155 api.kube-cluster.revachol.home
          192.168.1.156 api.kube-cluster.revachol.home
          192.168.1.157 api.kube-cluster.revachol.home
          fallthrough

      # If it's not a custom zones, check if it's a Kubernetes service.
      #- name: kubernetes
      #  parameters: cluster.local in-addr.arpa ip6.arpa
      #  configBlock: |-
      #    pods insecure
      #    fallthrough in-addr.arpa ip6.arpa
      #    ttl 30

      # If nothing above has handled the request, forward it to an upstream resolver.
      # Using Cloudflare + Google DNS to bypass ISP-level DNS blocking.
      - name: forward
        parameters: . 1.1.1.1 8.8.8.8

      # --- Other utility plugins ---
      - name: cache
        parameters: 30
      - name: loop
      - name: reload
      - name: loadbalance

  # This instance is LAN-facing (.home, .monederobox.dev) and deliberately not the
  # cluster's own CoreDNS -- the commented-out `kubernetes` plugin above was an earlier,
  # abandoned attempt at giving it real in-cluster service discovery (would need its own
  # RBAC to watch the k8s API). Simpler and lower-risk: delegate cluster.local specifically
  # to the real cluster CoreDNS (kube-system, ClusterIP 10.43.0.10) as its own zone.
  # Root cause: any pod using this server as its ONLY nameserver (dnsPolicy: None, e.g.
  # opencloud, which needs split-horizon .monederobox.dev resolution) got NXDOMAIN for
  # every in-cluster service name -- confirmed live, 100% reproducible, not a race --
  # because this server's only fallback was the public forwarders below, and opencloud's
  # own supervisor panics instead of degrading when that keeps failing.
  - zones:
      - zone: cluster.local
    port: 53
    plugins:
      - name: errors
      - name: forward
        parameters: . 10.43.0.10
      - name: cache
        parameters: 30
