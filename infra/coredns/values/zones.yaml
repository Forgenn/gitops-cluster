servers:
  - zones:
    port: 53
    plugins:
      # --- Core utility plugins first ---
      - name: errors
      - name: health
        configBlock: |-
          lameduck 10s
      - name: ready
      - name: log

      # Handle  custom zones before checking for anything else.
      - name: template
        parameters: IN A monederobox.dev
        configBlock: |
          match ^([a-z0-9-]+)\.monederobox\.dev\.$
          answer "{{ .Name }} 60 IN A 192.168.1.200"

      # Static .home records — this used to be served by a Docker `bind` container
      # on dolores, backed by the /storage/hydrogen disk. That was an undocumented,
      # unmonitored single point of failure for the whole LAN's .home resolution
      # (root cause of the original dolores.home ENOTFOUND crash-loop too — see the
      # migration report). Moving it here makes it GitOps-managed instead.
      - name: hosts
        parameters: home
        configBlock: |
          192.168.1.34  dolores.home
          192.168.1.155 dubois.home
          192.168.1.156 cuno.home
          192.168.1.157 katsuragi.home
          # k3s API server — only dubois runs the server role right now (cuno/katsuragi
          # HA conversion still pending), so this is a single record, not a 3-way set.
          # Re-point once the HA conversion lands. This was also served by the old bind
          # container and got missed in the initial CoreDNS migration.
          192.168.1.155 api.kube-cluster.revachol.home
          fallthrough

      # If it's not a custom zones, check if it's a Kubernetes service.
      #- name: kubernetes
      #  parameters: cluster.local in-addr.arpa ip6.arpa
      #  configBlock: |-
      #    pods insecure
      #    fallthrough in-addr.arpa ip6.arpa
      #    ttl 30

      # If nothing above has handled the request, forward it to an upstream resolver.
      # Using Cloudflare + Google DNS to bypass ISP-level DNS blocking.
      - name: forward
        parameters: . 1.1.1.1 8.8.8.8

      # --- Other utility plugins ---
      - name: cache
        parameters: 30
      - name: loop
      - name: reload
      - name: loadbalance
