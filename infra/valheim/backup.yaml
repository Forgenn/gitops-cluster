# World + config backup via volsync to the Hetzner S3 bucket.
# NOTE: the in-container server binary lives in subPath 'server' — setting
# replica-snapshot here would back that up too. We back up the whole PVC
# (config/ + server/); the ~1GB binary is cheap and ensures a clean restore.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: valheim-data
spec:
  sourcePVC: valheim-data
  trigger:
    schedule: "0 8 * * *"
  restic:
    copyMethod: Direct
    pruneIntervalDays: 14
    cacheCapacity: 1Gi
    repository: valheim-restic-config
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
    retain:
      daily: 7
      within: 3d