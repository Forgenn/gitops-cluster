apiVersion: v1
kind: Service
metadata:
  name: valheim
  namespace: valheim
  annotations:
    # dedicated VIP in the MetalLB pool (192.168.1.200-250). Pick a free IP.
    metallb.io/load-balancer-ip: "192.168.1.220"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local # preserve client source IP (Valheim status/admin needs it)
  selector:
    app: valheim
  ports:
    - name: game
      port: 2456
      targetPort: 2456
      protocol: UDP
    - name: query
      port: 2457
      targetPort: 2457
      protocol: UDP
    - name: query2
      port: 2458
      targetPort: 2458
      protocol: UDP