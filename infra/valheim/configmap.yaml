apiVersion: v1
kind: ConfigMap
metadata:
  name: valheim-config
  namespace: valheim
data:
  SERVER_NAME: "Hereslag Hyldet Smedje" # TODO: pick a real server name
  WORLD_NAME: "Hereslag" # TODO: world name = base of world.db/world.fwl
  SERVER_PORT: "2456"
  SERVER_PUBLIC: "true" # list in Steam community browser when idle
  # Auto-update: check Steam for a newer dedicated-server build every 15min,
  # but only apply when no players are connected (updates + restarts alone).
  # This is what picks up Valheim 1.0 tomorrow automatically.
  UPDATE_CRON: "*/15 * * * *"
  UPDATE_IF_IDLE: "true"
  RESTART_CRON: "0 5 * * *" # daily 05:00 idle restart (server file refresh)
  BACKUPS: "false" # in-container backups off; volsync handles world backup
  TZ: "UTC"
  # World modifiers, applied as CLI args on every server start.
  #   Resources most  -> 3x drop rate (the scale runs 0.5x..3x; "more" is only 1.5x).
  #                      Applies to kills, mining, foraging and destructibles;
  #                      does NOT affect fish, trophies or boss drops.
  #   Portals casual  -> "portal items": everything teleports, metals/ores included.
  #   DeathPenalty casual -> skill loss per death 1% (Normal is 5%) and equipped
  #                      gear is kept; unequipped inventory still drops. 1% is the
  #                      floor -- no vanilla modifier removes skill loss entirely.
  # Deliberately no -preset: a preset overwrites individual modifiers set before
  # it, and everything else stays Normal. All three are difficulty settings,
  # not cheats, so Steam achievements remain eligible -- only Hammer preset and
  # -setkey nobuildcost trip the (reversible) cheat lockout, and devcommands
  # like `spawn` are the permanent one. See valheim.com/support/valheim-1-0-faq/
  SERVER_ARGS: "-modifier Resources most -modifier Portals casual -modifier DeathPenalty casual"