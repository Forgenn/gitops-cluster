# hrld dashboard (hrld repo, H1b Task 4). Lives in monitoring: the Grafana sidecar
# only watches this namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hrld-dashboard
  labels:
    grafana_dashboard: "1"
data:
  hrld.json: |-
    {
      "uid": "hrld",
      "title": "hrld",
      "tags": [
        "hrld",
        "matrix"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "description": "hrld agent host: Matrix events, replies, latency, transactions, E2EE. Rates are per minute.",
      "templating": {
        "list": [
          {
            "name": "ds_prometheus",
            "label": "Datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "hrld",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "max(up{job=\"hrld\",namespace=\"hrld\"})"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Homeserver ping",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "max(hrld_homeserver_ping_ok)"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Replies (24h)",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum(increase(hrld_replies_total{outcome=\"sent\"}[24h]))"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Reply latency p50 (1h)",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(hrld_reply_latency_seconds_bucket[1h])))"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Events received",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum by (bot, kind) (rate(hrld_events_received_total[5m])) * 60",
              "legendFormat": "{{bot}} {{kind}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Replies by outcome",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum by (bot, outcome) (rate(hrld_replies_total[5m])) * 60",
              "legendFormat": "{{bot}} {{outcome}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Reply latency",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "histogram_quantile(0.5, sum by (le, bot) (rate(hrld_reply_latency_seconds_bucket[10m])))",
              "legendFormat": "{{bot}} p50"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "histogram_quantile(0.95, sum by (le, bot) (rate(hrld_reply_latency_seconds_bucket[10m])))",
              "legendFormat": "{{bot}} p95"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Appservice transactions",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum by (outcome) (rate(hrld_transactions_total[5m])) * 60",
              "legendFormat": "{{outcome}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "E2EE request failures",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum by (bot) (increase(hrld_crypto_request_failures_total[10m]))",
              "legendFormat": "{{bot}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Memory",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "gridPos": {
            "x": 12,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum by (container) (container_memory_working_set_bytes{namespace=\"hrld\",container!=\"\"})",
              "legendFormat": "{{container}}"
            }
          ]
        }
      ]
    }
