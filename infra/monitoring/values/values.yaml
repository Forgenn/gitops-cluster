# k3s runs the scheduler, controller-manager, and kube-proxy embedded inside the k3s
# server binary rather than as separately-scrapable pods the way kube-prometheus-stack's
# default ServiceMonitors expect (upstream kubeadm-style clusters). These three alerts
# were permanently firing false positives since day one, not real outages -- disabling
# their ServiceMonitor + PrometheusRule pair rather than silencing in Alertmanager, since
# there's nothing real to monitor here. kubeEtcd and kubeApiServer stay enabled -- k3s
# does expose those in a scrapable way and their alerts were not firing. Found via audit.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

alertmanager:
  enabled: true
  # Was single-replica with no PDB. Alertmanager has real gossip-based clustering
  # support (unlike Prometheus, which would need Thanos for meaningful HA) -- 2
  # replicas properly dedupe notifications and share silence/inhibition state, not
  # just two independent instances. Found via the Opus 5 audit.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  alertmanagerSpec:
    replicas: 2
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    # Mounts telegram-bot-credentials (synced from Infisical) at
    # /etc/alertmanager/secrets/telegram-bot-credentials/ -- config.receivers below
    # references the BOT_TOKEN file from there so the token never lands in git.
    secrets:
      - telegram-bot-credentials

  # Was routing every alert to a null receiver -- nothing was ever delivered anywhere.
  # chat_id is the numeric Telegram chat ID; low sensitivity (useless without the bot
  # token) so it's fine inlined here rather than file-mounted -- Alertmanager's
  # telegram_configs has no chat_id_file equivalent anyway.
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: ['namespace']
      - target_matchers: ['alertname = Watchdog']
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: telegram
      routes:
        - matchers: ['alertname = Watchdog']
          receiver: 'null'
        # 8 apps (hermes-agent, infisical, karakeep, pocket-id, seaweedfs,
        # sparky-fitness, vaultwarden, zot) are permanently OutOfSync from a known,
        # already-fixed-in-git cosmetic ArgoCD diff (StatefulSet volumeClaimTemplates
        # server-side defaults) that hasn't gone live yet -- it's k3s-addon-managed and
        # needs a supervised `nh os switch` on dubois, not a live kubectl patch (already
        # tried and reverted once). Muting until that lands rather than paging on a
        # known non-issue every repeat_interval. Remove this route once the switch
        # happens and re-verify these actually clear.
        - matchers: ['alertname = ArgoAppNotSynced']
          receiver: 'null'
    receivers:
      - name: 'null'
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/telegram-bot-credentials/BOT_TOKEN
            chat_id: 7850573137
            parse_mode: ''

grafana:
  enabled: true
  admin:
    existingSecret: "grafana-admin-credentials"
    userKey: admin-user
    passwordKey: admin-password

  extraSecretMounts:
    - name: grafana-oidc-credentials-mount
      secretName: grafana-oidc-credentials
      defaultMode: 0440
      mountPath: /etc/grafana/secrets
      readOnly: true

  defaultDatasource:
    enabled: false
  additionalDataSources:
    - name: Prometheus
      type: prometheus
      # This is the correct URL for a service in the 'monitoring' namespace
      url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
      access: proxy
      isDefault: false
  #env:
  #  GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
  #    valueFrom:
  #      secretKeyRef:
  #        name: grafana-oidc-credentials
  #        key: oidc-client-id
  #  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
  #    valueFrom:
  #      secretKeyRef:
  #        name: grafana-oidc-credentials
  #        key: oidc-client-secret

  grafana.ini:
    server:
      root_url: https://grafana.monederobox.dev
    auth:
      disable_login_form: true
    auth.generic_oauth:
      enabled: true
      name: PocketID
      icon: signin
      allow_sign_up: true
      client_id: $__file{/etc/grafana/secrets/oidc-client-id}
      client_secret: $__file{/etc/grafana/secrets/oidc-client-secret}
      scopes: openid profile email groups
      auth_url: https://pocket-id.monederobox.dev/authorize
      token_url: https://pocket-id.monederobox.dev/api/oidc/token
      api_url: https://pocket-id.monederobox.dev/api/oidc/userinfo
      role_attribute_path: "contains(groups, 'GrafanaAdmins') && 'Admin' || 'Viewer'"

  persistence:
    enabled: true
    type: pvc
    storageClassName: longhorn
    accessModes:
      - ReadWriteMany
    size: 1Gi
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"

prometheus:
  enabled: true
  prometheusSpec:
    # Was 24h on a 1Gi memory limit -- live usage was already 965Mi against that limit,
    # and the container was being OOMKilled repeatedly (14 restarts observed) plus
    # continuously CPU-throttled at 500m. Every OOM drops the in-memory head block, so
    # actual usable retention was far less than 24h. Found via the Opus 5 audit.
    retention: 15d
    # dolores isn't a k8s node, so the chart's own DaemonSet-based node-exporter (below)
    # never reaches it. Static target instead -- node_exporter enabled directly in its
    # NixOS config, firewalled to just the 3 cluster node IPs.
    additionalScrapeConfigs:
      - job_name: dolores-node-exporter
        static_configs:
          - targets: ["dolores.home:9100"]
            labels:
              instance: dolores
              role: nas
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 3Gi

prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  tls:
    enabled: false
  serviceMonitor:
    selfMonitor: false
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

nodeExporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
