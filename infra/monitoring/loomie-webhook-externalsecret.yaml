# Bearer token Alertmanager presents to loomie-backend's Alertmanager
# integration (POST /api/v1/integrations/alertmanager). The SAME Infisical
# value loomie-backend consumes as env ALERTMANAGER_WEBHOOK_TOKEN via
# infra/loomie/secrets/externalsecret.yaml -- keep both sides in sync.
# Mounted into Alertmanager through alertmanagerSpec.secrets at
# /etc/alertmanager/secrets/loomie-webhook-credentials/TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loomie-webhook-credentials
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: loomie-webhook-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TOKEN
      remoteRef:
        key: /loomie/ALERTMANAGER_WEBHOOK_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
  refreshInterval: 1h
