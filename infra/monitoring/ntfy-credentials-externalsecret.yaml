# Publish credentials for the ntfy receivers in alertmanager.config.receivers
# (values/values.yaml): the password of ntfy user 'loomie', the only account with
# write ACL on topics 'loomie-*'. Same Infisical value the ntfy namespace's own
# ExternalSecret (infra/ntfy/externalsecret.yaml) uses to manage that user.
# Mounted into Alertmanager via alertmanagerSpec.secrets at
# /etc/alertmanager/secrets/ntfy-credentials/TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-credentials
spec:
  secretStoreRef:
    name: infisical-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: ntfy-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TOKEN
      remoteRef:
        key: /ntfy/NTFY_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
  refreshInterval: 1h
